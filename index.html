<style>

};

const PAL=['#6c8cff','#f5a524','#22c3a6','#e5568f','#9b7bff','#41b8e8','#f07c3c','#a3c94a'];

/* 계좌별 매매 수수료 기본값 (설정에서 계좌별로 덮어씀). 키: 시장|계좌명에 포함된 증권사명
   b/s: 매수/매도 수수료 %, sec: 미장 매도 SEC Fee %, min: SEC 최소금액($), until: 우대요율 종료일, after: 종료 후 수수료 % */
const FEE_DEF={
  'KR|토스':{b:0.015,s:0.015,sec:'',min:'',until:'',after:''},
  'KR|메리츠':{b:0,s:0,sec:'',min:'',until:'2026-12-31',after:''},
  'US|토스':{b:0.1,s:0.1,sec:0.00206,min:0.01,until:'',after:''},
  'US|메리츠':{b:0,s:0,sec:'',min:'',until:'2026-12-31',after:0.07}
};
const FEE_F=['b','s','sec','min','until','after'];
/* 환전 우대 기본값 (설정에서 증권사별로 덮어씀). 키: 계좌명에 포함된 증권사명
   spread: 기본 환전 스프레드 %, pref: 우대율 %, until: 우대 종료일, after: 종료 후 우대율 % */
const FXP_DEF={'메리츠':{spread:1,pref:100,until:'2026-12-31',after:95},'토스':{spread:1,pref:95,until:'',after:''}};
const FLOW_T=['입금','출금','달러 매수','달러 매도'];
const isFxT=t=>t==='달러 매수'||t==='달러 매도';
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;if(v==null||v==='')return 0;const n=parseFloat(String(v).replace(/[^0-9.\-eE]/g,''));return isFinite(n)?n:0};
const str=v=>v==null?'':String(v).trim();
const sum=(a,k)=>a.reduce((s,x)=>s+(typeof k==='function'?k(x):num(x[k])),0);
const EPOCH=Date.UTC(1899,11,30);
const toSerial=v=>{if(typeof v==='number')return Math.floor(v);const s=str(v);const m=s.match(/^(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/);return m?Math.round((Date.UTC(+m[1],+m[2]-1,+m[3])-EPOCH)/864e5):0};
const sToStr=s=>s?new Date(EPOCH+Math.round(s)*864e5).toISOString().slice(0,10):'';
const p2=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`};
const nowStr=()=>{const d=new Date();return `${todayStr()} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const qn=t=>`'${String(t).replace(/'/g,"''")}'`;
const safeText=s=>{s=str(s);return /^[=+\-@]/.test(s)?"'"+s:s};
function fmtMoney(n,ccy,o={}){n=+n||0;const a=Math.abs(n);const s=ccy==='USD'?'$'+a.toLocaleString('en-US',{minimumFractionDigits:o.dec??2,maximumFractionDigits:o.dec??2}):'₩'+Math.round(a).toLocaleString('ko-KR');return (n<0&&(ccy==='USD'?a>=0.005:Math.round(a)>0)?'-':(o.sign&&n>0?'+':''))+s}
const fmtPct=(r,o={})=>{r=+r||0;return (o.sign!==false&&r>0?'+':'')+(r*100).toFixed(o.d??1)+'%'};
const fmtQty=q=>(+q||0).toLocaleString('ko-KR',{maximumFractionDigits:4});
const fmtNum=(n,d=2)=>(+n||0).toLocaleString('ko-KR',{maximumFractionDigits:d});
const fmtShort=(n,ccy)=>{const a=Math.abs(n),g=n<0?'-':'';if(ccy==='USD')return g+'$'+(a>=1e6?(a/1e6).toFixed(2)+'M':a>=1e3?(a/1e3).toFixed(1)+'K':a.toFixed(0));return g+(a>=1e8?(a/1e8).toFixed(2)+'억':a>=1e6?Math.round(a/1e4).toLocaleString('ko-KR')+'만':a>=1e4?(+(a/1e4).toFixed(1))+'만':'₩'+Math.round(a).toLocaleString('ko-KR'))};
const cls=n=>n>0?'up':n<0?'dn':'';
const b64=u8=>btoa(String.fromCharCode(...u8));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
const parseId=s=>{s=str(s);const m=s.match(/\/d\/([a-zA-Z0-9_-]{20,})/);return m?m[1]:s.replace(/[^a-zA-Z0-9_-]/g,'')};
class AuthErr extends Error{constructor(m){super(m||'Google 로그인이 필요합니다');this.auth=true}}

/* ================= 상태 ================= */
const S={cfg:Object.assign({},DEF,LS.get('sj.cfg',{})),token:null,tokenExp:0,email:'',D:null,locked:true,loading:false,err:'',needAuth:false,hiddenAt:0,lastAct:Date.now(),pin:'',pinMode:'unlock',pinFirst:'',pinMsg:'',busy:false,modal:null,
  v:{tab:'home',stock:null,ccy:'KRW',hf:'all',hs:'weight',cm:'all',cs:'recent',an:'trend',per:'3M',tool:'avg',rbs:'KR',rbc:'1',mr:'KR',st:'KR',sm:'KR',fm:'KR',tk:'',cr:'3mo',sg:'sig',pz:'all',su:'all',ov:'ma',ok:'d'}};
const saveCfg=()=>LS.set('sj.cfg',S.cfg);
const configured=()=>S.cfg.demo||(S.cfg.clientId&&S.cfg.mainId&&S.cfg.krId&&S.cfg.usId);
const demoOpen=()=>S.cfg.demo&&!LS.get('sj.pin');

/* ================= 계산 엔진 (시트 수식과 동일) ================= */
function feeRule(m,acc){
  const saved=(S.cfg.fees||{})[m+'|'+acc];if(saved)return Object.assign({b:0,s:0,sec:'',min:'',until:'',after:''},saved);
  const d=Object.entries(FEE_DEF).find(([k])=>{const [mm,br]=k.split('|');return mm===m&&String(acc).includes(br)});
  return Object.assign({},d?d[1]:{b:0,s:0,sec:'',min:'',until:'',after:''});
}
// 환전 적용 환율 = 매매기준율 × (1 ± 기본 스프레드 × (1 − 우대율)). 달러 매수는 +, 달러 매도는 −. 0.01원 단위 반올림
function fxRule(acc){
  const saved=(S.cfg.fxp||{})[acc];if(saved)return Object.assign({spread:1,pref:0,until:'',after:''},saved);
  const d=Object.entries(FXP_DEF).find(([br])=>String(acc).includes(br));
  return Object.assign({spread:1,pref:0,until:'',after:''},d?d[1]:{});
}
function calcFx(acc,type,date,base){
  const r=fxRule(acc);const expired=!!(r.until&&date&&date>toSerial(r.until));
  const pref=expired&&str(r.after)!==''?num(r.after):num(r.pref);
  const sp=Math.max(0,num(r.spread)*(1-pref/100))/100;const buy=type==='달러 매수';
  const rate=base?Math.round(base*(buy?1+sp:1-sp)*100)/100:0;
  return {rate,pref,desc:`${acc||'계좌 미지정'} 우대 ${fmtNum(pref,2)}%${r.until?(expired?` (${r.until} 이후)`:` (~${r.until})`):''} · 스프레드 ${fmtNum(sp*100,4)}%`};
}
// 수수료 계산: 국장은 원 단위 절사, 미장 수수료는 센트 반올림, SEC Fee는 센트 올림(최소금액 적용)
function calcFee(m,acc,type,date,qty,price){
  const r=feeRule(m,acc),amt=Math.abs(num(qty))*num(price),sell=type==='매도';
  const expired=!!(r.until&&date&&date>toSerial(r.until));
  let rate=num(sell?r.s:r.b);if(expired&&str(r.after)!=='')rate=num(r.after);
  const parts=[];let fee=m==='KR'?Math.floor(amt*rate/100+1e-9):Math.round(amt*rate+1e-9)/100;
  parts.push(`${acc||'계좌 미지정'} ${fmtNum(rate,4)}%${r.until?(expired?` (${r.until} 이후 요율)`:` (~${r.until})`):''}`);
  if(sell&&m==='US'&&num(r.sec)>0&&amt>0){const sec=Math.max(num(r.min),Math.ceil(amt*num(r.sec)-1e-9)/100);fee+=sec;parts.push(`SEC ${fmtMoney(sec,'USD')}`)}
  if(sell&&m==='KR'&&num(S.cfg.taxKRsell)>0&&amt>0){const t=Math.floor(amt*num(S.cfg.taxKRsell)/100+1e-9);fee+=t;parts.push(`거래세 ${fmtNum(S.cfg.taxKRsell,4)}%`)}
  if(m==='US')fee=Math.round(fee*100)/100;
  return {fee,desc:parts.join(' + ')};
}
function calcTrades(trades){
  let cum=0,avg=0;
  return trades.map(t=>{
    const q=Math.abs(num(t.qty)),p=num(t.price),f=num(t.fee),sell=t.type==='매도';
    const amount=sell?q*p-f:q*p+f;let realized=0;const pc=cum,pa=avg;
    if(sell){cum=pc-q;realized=amount-q*pa;avg=Math.abs(cum)<1e-9?0:pa}
    else{cum=pc+q;avg=cum?(pc*pa+amount)/cum:0}
    return Object.assign({},t,{amount,cum,avg,realized});
  });
}
const tradeKey=(h,t)=>[MKL[h.mkt],h.tab,sToStr(t.date),t.type,Math.abs(num(t.qty)),num(t.price)].join('|');
const isLev=h=>/레버리지|인버스|2X|3X/i.test(h.name+h.tab)||(h.mkt==='US'&&LEV_US.has(String(h.ticker).split(':').pop().toUpperCase()));

/* ================= Google 인증 ================= */
let gisP=null;
function loadGIS(){
  if(gisP)return gisP;
  gisP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>{gisP=null;rej(new Error('Google 로그인 스크립트를 불러오지 못했습니다'))};document.head.appendChild(s)});
  return gisP;
}
const tokenOk=()=>S.cfg.demo||(S.token&&Date.now()<S.tokenExp);
async function getToken(){
  if(S.cfg.demo){S.email='demo@example.com';return 'demo'}
  await loadGIS();
  const tok=await new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({client_id:S.cfg.clientId,scope:SCOPES,prompt:'',login_hint:S.cfg.email||undefined,
      callback:r=>{if(r.error)return rej(new Error(r.error_description||r.error));if(!google.accounts.oauth2.hasGrantedAllScopes(r,SHEETS_SCOPE))return rej(new Error('스프레드시트 권한이 허용되지 않았습니다'));S.token=r.access_token;S.tokenExp=Date.now()+(num(r.expires_in)-120)*1000;res(r.access_token)},
      error_callback:e=>rej(new Error(e&&e.type==='popup_failed_to_open'?'팝업이 차단되었습니다. 아래 버튼을 눌러 다시 시도하세요.':e&&e.type==='popup_closed'?'로그인 창이 닫혔습니다.':(e&&(e.message||e.type))||'로그인 실패'))});
    tc.requestAccessToken();
  });
  const r=await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok},cache:'no-store'});
  const u=await r.json().catch(()=>({}));
  const em=str(u.email).toLowerCase();
  if(S.cfg.email&&em!==S.cfg.email.toLowerCase()){try{google.accounts.oauth2.revoke(tok)}catch(e){}S.token=null;throw new Error(`허용되지 않은 계정입니다 (${em||'알 수 없음'}). 설정된 계정: ${S.cfg.email}`)}
  if(!S.cfg.email&&em){S.cfg.email=em;saveCfg();toast('허용 계정으로 '+em+' 을(를) 등록했습니다')}
  S.email=em;return tok;
}
function logout(){
  if(!S.cfg.demo&&S.token){try{google.accounts.oauth2.revoke(S.token)}catch(e){}}
  S.token=null;S.tokenExp=0;S.D=null;S.needAuth=true;render();
}

/* ================= API 전송 ================= */
async function api(method,url,body){
  if(S.cfg.demo)return Demo.handle(method,url,body);
  if(!tokenOk())throw new AuthErr();
  const r=await fetch(url,{method,headers:Object.assign({Authorization:'Bearer '+S.token},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined,cache:'no-store',referrerPolicy:'no-referrer'});
  if(r.status===401){S.token=null;throw new AuthErr('로그인이 만료되었습니다')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
  return j;
}
const ids=()=>S.cfg.demo?{main:'demo-main',KR:'demo-kr',US:'demo-us'}:{main:S.cfg.mainId,KR:S.cfg.krId,US:S.cfg.usId};
const getVals=async(id,range,render='UNFORMATTED_VALUE')=>((await api('GET',`${SH}/${id}/values/${encodeURIComponent(range)}?valueRenderOption=${render}&dateTimeRenderOption=SERIAL_NUMBER`)).values)||[];
const batchUpdateVals=(id,data)=>api('POST',`${SH}/${id}/values:batchUpdate`,{valueInputOption:'USER_ENTERED',data});

const batchGet=(id,ranges)=>ranges.length?api('GET',`${SH}/${id}/values:batchGet?${ranges.map(r=>'ranges='+encodeURIComponent(r)).join('&')}&valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER`):Promise.resolve({valueRanges:[]});
const meta=id=>api('GET',`${SH}/${id}?fields=${encodeURIComponent('sheets.properties(sheetId,title)')}`);

/* ================= 로드 ================= */
async function fetchAll(){
  const I=ids();
  const [mm,km,um]=await Promise.all([meta(I.main),meta(I.KR),meta(I.US)]);
  const sid=m=>Object.fromEntries((m.sheets||[]).map(s=>[s.properties.title,s.properties.sheetId]));
  const mainS=sid(mm);
  const req=[`${qn('총자산')}!A1:J30`,`${qn(CASH)}!A1:H`,`${qn('설정')}!B5`];
  const opt=APPK.filter(k=>APP[k] in mainS);
  opt.forEach(k=>req.push(`${qn(APP[k])}!A2:${HCOL[k]}`));
  const mkReq=m=>{const s=sid(m);const titles=Object.keys(s).filter(t=>t!=='종목목록');return {s,titles,ranges:[...titles.map(t=>`${qn(t)}!A1:K`),...('종목목록' in s?[`${qn('종목목록')}!A2:A`]:[])]}};
  const kq=mkReq(km),uq=mkReq(um);

function parseTab(mkt,title,v,sheetId){

function parseCash(v){
  const o={baseDate:0,baseFx:0,fxEffect:null,fxRealized:0,principalUSKRW:0,missing:'',flows:[],flowStart:0,flowOld:false,KR:{acc:[],total:null,principal:0},US:{acc:[],total:null,principal:0}};
  const ro=r=>({name:str(r[0]),invest:num(r[1]),cash:num(r[2]),total:num(r[3]),weight:num(r[4]),baseCash:num(r[5]),realizedAfter:num(r[6]),netFlow:num(r[7])});
  let sec=null,inAcc=false,inFlow=false;
  v.forEach((r,i)=>{r=r||[];const a=str(r[0]);
    if(!o.flowStart){const c=str(r[2]);if(c.startsWith('환차손익'))o.fxEffect=num(r[3]);else if(c.startsWith('환전 실현손익'))o.fxRealized=num(r[3])}
    if(o.flowStart){if(i+1>=o.flowStart&&(a||str(r[1])||str(r[2])))o.flows.push({row:i+1,date:toSerial(r[0]),type:str(r[1]),acc:str(r[2]),krw:num(r[3]),fx:num(r[4]),usd:num(r[5]),memo:str(r[6])});return}
    if(a==='기준일')o.baseDate=toSerial(r[1]);
    else if(a.startsWith('원화 계좌')){sec='KR';inAcc=false}
    else if(a.startsWith('달러 계좌')){sec='US';inAcc=false}
    else if(a.startsWith('입출금')){sec=null;inFlow=true}
    else if(inFlow&&a==='일자'){if(str(r[1])==='구분')o.flowStart=i+2;else o.flowOld=true}
    else if(sec&&a==='계좌')inAcc=true;
    else if(sec&&a==='합계'){o[sec].total=ro(r);inAcc=false}
    else if(sec&&inAcc&&a)o[sec].acc.push(ro(r));
    else if(sec&&a==='투자 원금')o[sec].principal=num(r[1]);
    else if(a.startsWith('기준 환율'))o.baseFx=num(r[1]);
    else if(a.startsWith('투자 원금 (원화'))o.principalUSKRW=num(r[1]);
    else if(a.startsWith('목록에 없는'))o.missing=str(r[1]);
  });
  return o;
}
// '총자산' 요약 표: A열 '요약' 헤더 기준으로 행/열 방향 모두 지원 (열=구분·행=지표 또는 그 반대)
function parseSummary(v){
  const G=x=>{x=str(x);if(/^국장/.test(x))return 'KR';if(/^미장/.test(x))return /원화/.test(x)?'USKRW':'US';if(/^합계/.test(x))return /USD|달러/.test(x)?'TOTUSD':'TOT';return null};
  const MET={'투자 원금':'principal','매수금액':'cost','평가금액':'value','예수금':'cash','총 평가자산':'total','총 손익':'pnl','수익률':'rr','누적 실현손익':'realized'};
  const mk=x=>MET[str(x).replace(/\s+/g,' ')]||null;
  const out={};['KR','US','USKRW','TOT','TOTUSD'].forEach(k=>out[k]={principal:0,cost:0,value:0,cash:0,total:0,pnl:0,rr:0,realized:0});
  let found=0;const hi=v.findIndex(r=>r&&str(r[0])==='요약');
  if(hi>=0){const h=v[hi]||[];
    if(h.slice(1).some(G)){for(let i=hi+1;i<v.length;i++){const r=v[i]||[];const m=mk(r[0]);if(!m)continue;h.forEach((c,j)=>{const g=j&&G(c);if(g){out[g][m]=num(r[j]);found++}})}}
    else if(h.slice(1).some(mk)){for(let i=hi+1;i<v.length;i++){const r=v[i]||[];const g=G(r[0]);if(!g)continue;h.forEach((c,j)=>{const m=j&&mk(c);if(m){out[g][m]=num(r[j]);found++}})}}}
  if(!found)throw new Error("'총자산' 시트에서 요약 표를 찾지 못했습니다 (A열에 '요약' 헤더 필요)");
  return out;
}

  async snapshot(){return this.upsert('snap',todayStr(),this.snapRow())},

    const add=rows.filter(r=>!have.has(r[0]));if(!add.length)return [];const st=Math.max(2,col.length+1);

    const add=rows.filter(r=>!have.has(r[0]));if(!add.length)return [];const st=Math.max(2,col.length+1);

async function pbkdf(pin,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256)))}

function regFail(){const f=failState();f.n++;if(f.n>=5)f.until=Date.now()+Math.min(3600e3,30e3*Math.pow(2,f.n-5));LS.set('sj.fail',f)}

/* ================= 뒤로가기 =================
   Android 뒤로가기(물리키·제스처)는 CloseWatcher로 받는다(Chrome 120+). 화면 이동에 history 기록을 쓰지 않아
   앱의 기록이 1개로 유지되므로 window.close()로 앱을 닫을 수 있고, 시스템의 '홈으로' 전환 애니메이션도 생기지 않는다.
   CloseWatcher가 없는 브라우저는 기존처럼 history 기록으로 화면 뒤로가기만 처리한다(홈에서는 브라우저 기본 동작). */
const NAV={cw:null,on:typeof window.CloseWatcher==='function',exiting:false};
function navArm(){
  if(!NAV.on||NAV.cw||NAV.exiting||NAV.exitAsk)return;
  try{const w=new CloseWatcher();w.onclose=()=>{if(NAV.cw===w)NAV.cw=null;onBack();navArm()};NAV.cw=w}catch(e){NAV.on=false}
}
const navPush=st=>{if(NAV.on)navArm();else history.pushState(st,'')};
function onBack(){
  if(S.dlgRes){closeDlg();return}                       // 확인창 → 취소
  if(S.modal){closeModal(true);return}                  // 입력 시트 닫기
  if(S.v.stock){S.v.stock=null;render();return}         // 종목 상세 → 목록
  if(S.v.tab!=='home'&&!S.locked){S.v.tab='home';render();window.scrollTo(0,0);return}
  if(NAV.on)askExit();
}
const navRelease=()=>{if(NAV.cw){const w=NAV.cw;NAV.cw=null;w.destroy()}};
async function askExit(){
  // 확인창이 떠 있는 동안은 뒤로가기 감시를 풀어 둔다 → 뒤로가기를 누르면 시스템이 앱을 닫음(= 종료 버튼)
  NAV.exitAsk=true;navRelease();
  const ok=await confirmBox('앱 종료','주식일지를 종료할까요?','종료');
  NAV.exitAsk=false;
  if(!ok){navArm();return}
  NAV.exiting=true;navRelease();
  window.close();
  // 브라우저 탭처럼 스크립트로 닫을 수 없는 창이면 감시를 해제한 채로 둔다 → 다음 뒤로가기는 시스템이 처리해 종료
  setTimeout(()=>{if(document.visibilityState==='visible'){toast('뒤로 버튼을 한 번 더 누르면 종료됩니다',3000);NAV.exiting=false;NAV.rearm=true}},350);
}
// 앱을 계속 쓰면 다시 뒤로가기를 받도록 감시를 건다
['pointerup','keydown'].forEach(e=>document.addEventListener(e,()=>{if(NAV.on&&!NAV.cw&&!NAV.exiting){NAV.rearm=false;navArm()}},true));
window.addEventListener('popstate',()=>{
  if(NAV.exitAsk){history.back();return}   // 이전 버전에서 남은 기록이 있으면 계속 되돌아가 앱을 벗어남
  if(S.skipPop){S.skipPop=false;return}
  if(!NAV.on)onBack();
});

/* ================= 차트 (SVG) ================= */
const CH={};
function lineChart(id,series,o={}){
  const W=340,H=o.h||170,L=46,R=10,T=10,B=22;
  const pts=series.flatMap(s=>s.pts);if(pts.length<2)return `<div class="empty">${o.empty||'기록이 2개 이상 쌓이면 그래프가 표시됩니다'}</div>`;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(o.zero){y0=Math.min(y0,0);y1=Math.max(y1,0)}
  const pad=(y1-y0)*.08||Math.abs(y1)*.05||1;y0-=pad;y1+=pad;if(x1===x0)x1=x0+1;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';for(let i=0;i<=3;i++){const yv=y0+(y1-y0)*i/3,yy=Y(yv);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${esc(o.yFmt?o.yFmt(yv):fmtNum(yv,0))}</text>`}
  if(o.zero&&y0<0&&y1>0)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx3)" stroke-dasharray="3 3"/>`;
  const xl=[x0,(x0+x1)/2,x1];g+=xl.map((x,i)=>`<text x="${X(x)}" y="${H-6}" text-anchor="${i===0?'start':i===2?'end':'middle'}">${esc(o.xFmt?o.xFmt(x):x)}</text>`).join('');
  let p='';series.forEach((s,si)=>{if(!s.pts.length)return;const d=s.pts.map((q,i)=>(i?'L':'M')+X(q.x).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
    if(s.area)p+=`<path d="${d} L${X(s.pts[s.pts.length-1].x).toFixed(1)} ${H-B} L${X(s.pts[0].x).toFixed(1)} ${H-B}Z" fill="${s.color}" opacity=".12"/>`;
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w??2}" ${s.dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots)p+=s.pts.map(q=>`<circle cx="${X(q.x).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="${q.r||3.5}" fill="${q.c||s.color}" stroke="var(--card)" stroke-width="1.5"/>`).join('')});
  CH[id]={series,X,Y,W,H,L,R,T,B,x0,x1,o};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${p}<line class="cur" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--tx3)" stroke-width="1" style="display:none"/></svg><div class="tip"></div></div>
    ${o.legend!==false?`<div class="lg">${series.filter(s=>s.name).map(s=>`<span><s style="background:${s.color}"></s>${esc(s.name)}</span>`).join('')}</div>`:''}`;
}
function chartMove(e){
  const el=e.target.closest('.chart');if(!el)return;const c=CH[el.dataset.chart];if(!c)return;
  const svg=$('svg',el),rc=svg.getBoundingClientRect();const vx=(e.clientX-rc.left)/rc.width*c.W;
  const base=c.series.find(s=>s.pts.length>1&&!s.noTip)||c.series[0];let best=null,bd=1e9;
  base.pts.forEach(p=>{const d=Math.abs(c.X(p.x)-vx);if(d<bd){bd=d;best=p}});if(!best)return;
  const ln=$('line.cur',svg);ln.setAttribute('x1',c.X(best.x));ln.setAttribute('x2',c.X(best.x));ln.style.display='';
  const tip=$('.tip',el);const rows=c.series.filter(s=>!s.noTip).map(s=>{const q=s.pts.find(p=>p.x===best.x);return q?`<div><span style="color:${s.color}">●</span> ${esc(s.name||'')} <b class="num">${esc(c.o.tipFmt?c.o.tipFmt(q.y,s):fmtNum(q.y))}</b>${q.lab?' '+esc(q.lab):''}</div>`:''}).join('');
  tip.innerHTML=`<div class="faint">${esc(c.o.xFmt?c.o.xFmt(best.x,true):best.x)}</div>${rows}`;tip.style.display='block';
  const px=c.X(best.x)/c.W*rc.width;tip.style.left=Math.min(Math.max(0,px-tip.offsetWidth/2),rc.width-tip.offsetWidth)+'px';tip.style.top='-6px';
}

function barChart(id,items,o={}){
  if(!items.length)return `<div class="empty">${o.empty||'데이터가 없습니다'}</div>`;
  const W=340,H=o.h||160,L=46,R=6,T=10,B=22;const ys=items.map(i=>i.v);let y0=Math.min(0,...ys),y1=Math.max(0,...ys);if(y0===y1)y1=1;const pad=(y1-y0)*.1;y1+=y1>0?pad:0;y0-=y0<0?pad:0;
  const Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);const bw=(W-L-R)/items.length;
  let g='';for(let i=0;i<=3;i++){const yv=y0+(y1-y0)*i/3,yy=Y(yv);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${esc(o.yFmt?o.yFmt(yv):fmtNum(yv,0))}</text>`}
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx3)"/>`;
  items.forEach((it,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,y=Y(Math.max(0,it.v)),h=Math.abs(Y(it.v)-Y(0));
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,it.v?1:0).toFixed(1)}" rx="2" fill="${it.v>=0?'var(--up)':'var(--dn)'}"/>`;
    if(items.length<=12||i%2===0)g+=`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(it.l)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg></div>`;
}
function donut(segs,center){
  const tot=sum(segs,'v')||1;let a=0;const r=52,C=2*Math.PI*r;
  const arcs=segs.map(s=>{const f=s.v/tot,d=`<circle r="${r}" cx="66" cy="66" fill="none" stroke="${s.c}" stroke-width="20" stroke-dasharray="${(f*C).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-a*C).toFixed(2)}" transform="rotate(-90 66 66)"/>`;a+=f;return d}).join('');
  return `<svg viewBox="0 0 132 132"><circle r="${r}" cx="66" cy="66" fill="none" stroke="var(--bg2)" stroke-width="20"/>${arcs}<text x="66" y="62" text-anchor="middle" font-size="11" fill="var(--tx3)">${esc(center[0])}</text><text x="66" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="var(--tx)">${esc(center[1])}</text></svg>`;
}

/* ================= 주가 차트 (Cloudflare Worker → Yahoo Finance) ================= */
const PXR=[['1d','1일'],['5d','1주'],['1mo','1개월'],['3mo','3개월'],['1y','1년'],['5y','5년']];
const PX={},PXD={};
const pxIntra=r=>r==='1d'||r==='5d';
const pxTTL=(r,d)=>pxIntra(r)?(d&&!d.open?600e3:60e3):(d&&d.open?300e3:1800e3);
const chartUrlOk=u=>/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev$/i.test(str(u));
// 시트 티커(GOOGLEFINANCE 형식) → Yahoo 심볼. 국장은 6자리 코드 + .KS(코스닥은 Worker가 .KQ로 재시도)
function ySym(h){const t=str(h.ticker).toUpperCase();const i=t.indexOf(':');const ex=i>0?t.slice(0,i):'',code=i>0?t.slice(i+1):t;
  if(h.mkt==='KR')return /^[0-9A-Z]{6}$/.test(code)?code+(ex==='KOSDAQ'?'.KQ':'.KS'):'';
  return /^[A-Z0-9][A-Z0-9.\-]{0,11}$/.test(code)?code.replace(/\./g,'-'):''}
async function pxFetch(sym,r,base){
  if(S.cfg.demo&&!base)return Demo.chart(sym,r);
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
  try{const res=await fetch(`${base||S.cfg.chartUrl}/chart?s=${encodeURIComponent(sym)}&r=${r}`,{signal:ctl.signal,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'});
    const j=await res.json().catch(()=>null);if(!res.ok||!j||j.error)throw new Error((j&&j.error)||'HTTP '+res.status);
    if(!Array.isArray(j.t)||!j.t.length)throw new Error('시세 데이터가 비어 있습니다');return pxIntra(r)?j:pxFill(j,r)}
  catch(e){throw new Error(e.name==='AbortError'?'응답 시간 초과':e.message==='Failed to fetch'?'차트 서버에 연결할 수 없습니다':e.message)}finally{clearTimeout(to)}}
// Yahoo 일봉·주봉이 마지막 거래일 봉을 늦게 넣는 경우 대비: 현재가(price·at)가 마지막 봉보다 새로우면 그날(그 주) 봉을 채움.
// Worker(fillLast)가 이미 채웠으면 그대로. 여기서 추가하는 봉은 시가=직전 종가(정확한 시가·고저는 Worker가 채움)
function pxFill(d,r){const n=d.t.length,px=num(d.price),at=num(d.at);if(!(px>0)||!at||!n)return d;
  const g=num(d.gmt),day=t=>Math.floor((t+g)/86400),wk=r==='5y',u=t=>wk?Math.floor((day(t)+3)/7):day(t),i=n-1,du=u(at)-u(d.t[i]);
  if(du<0||du>(wk?2:10))return d;
  if(du===0){d.c[i]=px;d.h[i]=Math.max(d.h[i],px);d.l[i]=Math.min(d.l[i],px);return d}
  const o=d.c[i];d.t.push(wk?(u(at)*7-3)*86400-g:at);d.o.push(o);d.h.push(Math.max(o,px));d.l.push(Math.min(o,px));d.c.push(px);d.v.push(0);d.fill='app';return d}
function pxEnsure(h,force){
  const sym=ySym(h),r=S.v.cr;if(!sym||!(S.cfg.demo||chartUrlOk(S.cfg.chartUrl)))return;
  const k=sym+'|'+r,c=PX[k]||(PX[k]={});if(c.busy)return;
  if(!force&&c.at&&Date.now()-c.at<(c.err?30e3:pxTTL(r,c.d)))return;
  c.busy=true;if(!c.d)pxPaint(h);
  pxFetch(sym,r).then(d=>{c.d=d;c.err=''},e=>{c.err=e.message}).finally(()=>{c.busy=false;c.at=Date.now();pxPaint(h)});
}
function pxPaint(h){const el=$('#pxc');if(el&&S.v.stock===h.key&&!S.locked)el.innerHTML=pxBody(h)}
const pxCard=h=>`<section class="card pxcard"><div id="pxc">${pxBody(h)}</div></section>`;

  const chipsH=`<div class="chips" style="margin-bottom:8px">${PXR.map(([v,l])=>`<button class="chip ${r===v?'on':''}" data-act="pxRange" data-val="${v}">${l}</button>`).join('')}</div>`;
  if(!sym)return chipsH+`<div class="empty">티커 ${esc(h.ticker)}를 차트 심볼로 바꿀 수 없습니다</div>`;

  if(!d)return chipsH+(c.err&&!c.busy?`<div class="empty">차트를 불러오지 못했습니다<div class="xs" style="margin-top:4px">${esc(c.err)}</div><button class="btn sm" style="margin-top:10px" data-act="pxRetry">다시 시도</button></div>`:`<div class="pxload"><div class="loader"></div></div>`);
  const n=d.c.length,last=d.c[n-1],base=r==='1d'?(d.prev||d.o[0]):(pxIntra(r)?d.o[0]:(d.prev&&r!=='5y'?d.prev:d.o[0])),chg=last-base,rr=base?chg/base:0,cc=h.ccy;
  const at=d.at||d.t[n-1],lt=new Date((at+d.gmt)*1000),us=h.mkt==='US';

   <div class="lg" style="margin-top:4px">${h.qty>0&&h.avg>0?'<span><s style="background:var(--warn)"></s>평단</span>':''}<span><s style="background:var(--ac)"></s>현재가</span>${pxIntra(r)?'':'<span style="color:var(--up)">▲ 매수</span><span style="color:var(--dn)">▼ 매도</span>'}</div>
   ${r==='1mo'||r==='3mo'||r==='1y'?`<div class="chips" style="margin-top:8px">${[['ma','이평선 20·60·200'],['st','SuperTrend'],['bb','볼린저밴드']].map(([k,l])=>`<button class="chip ${str(S.v.ov).split(',').includes(k)?'on':''}" data-act="pxOv" data-val="${k}">${l}</button>`).join('')}</div>${str(S.v.ov).includes('ma')?'<div class="lg" style="margin-top:6px"><span><s style="background:#f5a524"></s>20일</span><span><s style="background:#22c3a6"></s>60일</span><span><s style="background:#e5568f"></s>200일</span></div>':''}`:''}
   <div class="pxft"><span>${S.cfg.demo?'데모 · 가상 시세':asOf+' 기준 · '+(d.open?'장중 · 자동 갱신':'장 마감')}</span><span>${S.cfg.demo?'':'Yahoo Finance · 최대 약 20분 지연'}</span></div>`;
}
function pxSvg(h,d,r){
  const n=d.c.length;if(n<2)return '<div class="empty">표시할 시세가 없습니다</div>';
  const W=340,H=214,L=4,R=52,T=8,B=20,VH=30,ph=H-T-B-VH-6,pw=W-L-R,line=pxIntra(r),usd=h.ccy==='USD';

  let lo=Infinity,hi=-Infinity;for(let i=0;i<n;i++){lo=Math.min(lo,line?d.c[i]:d.l[i]);hi=Math.max(hi,line?d.c[i]:d.h[i])}
  const prev=r==='1d'?d.prev:0;if(prev){lo=Math.min(lo,prev);hi=Math.max(hi,prev)}
  const span=(hi-lo)||hi*.01||1,avg=h.qty>0&&h.avg>0?h.avg:0,avgIn=avg&&avg>=lo-span*.35&&avg<=hi+span*.35;
  if(avgIn){lo=Math.min(lo,avg);hi=Math.max(hi,avg)}
  const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
  const X=i=>L+(i+.5)*pw/n,Y=v=>T+(hi-v)/(hi-lo)*ph,bw=Math.max(1,Math.min(7,pw/n*.62)),vb=H-B,vmax=Math.max(1,...d.v);
  const last=d.c[n-1],up=i=>d.c[i]>=d.o[i];

  if(avg){const y=avgIn?Y(avg):(avg>hi?T+8:T+ph-8);pills.push([y,avg,'var(--warn)','k',!avgIn])}
  let g='';
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*(k+.5)/4,y=Y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;if(pills.every(p=>Math.abs(p[0]-y)>15))g+=`<text x="${W-R+6}" y="${(y+3.5).toFixed(1)}">${fP(v)}</text>`}
  for(let i=0;i<n;i++){const vh=d.v[i]/vmax*VH;if(vh>.3)g+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${(vb-vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}" fill="${up(i)?'var(--up)':'var(--dn)'}" opacity=".3"/>`}
  if(line){const col=last>=(prev||d.o[0])?'var(--up)':'var(--dn)';let p='';for(let i=0;i<n;i++)p+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.c[i]).toFixed(1);
    g+=`<path d="${p}L${X(n-1).toFixed(1)} ${T+ph}L${X(0).toFixed(1)} ${T+ph}Z" fill="${col}" opacity=".1"/><path d="${p}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
    if(prev)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(prev).toFixed(1)}" y2="${Y(prev).toFixed(1)}" stroke="var(--tx3)" stroke-dasharray="2 3"/>`}
  else for(let i=0;i<n;i++){const col=up(i)?'var(--up)':'var(--dn)',x=X(i).toFixed(1),y1=Y(Math.max(d.o[i],d.c[i])),y2=Y(Math.min(d.o[i],d.c[i]));
    g+=`<line x1="${x}" x2="${x}" y1="${Y(d.h[i]).toFixed(1)}" y2="${Y(d.l[i]).toFixed(1)}" stroke="${col}"/><rect x="${(X(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y2-y1).toFixed(1)}" fill="${col}"/>`}
  // 지표 오버레이(일봉 기간): 2년 일봉으로 계산한 지표를 날짜로 맞춰 겹쳐 그림
  const id='px'+h.mkt+h.sheetId,ov=str(S.v.ov).split(',');
  if((r==='1mo'||r==='3mo'||r==='1y')&&ov.some(Boolean)){const OX=sgX(ySym(h));if(OX){const mp=new Map(OX.ser.map((v,j)=>[v,j])),ix=d.t.map(t=>mp.get(Math.floor((t+d.gmt)/86400)+25569));
    const path=(a,col,dash)=>{let q='',pen=false;for(let i=0;i<n;i++){const j=ix[i],v=j!=null?a[j]:null;if(v==null){pen=false;continue}q+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true}
      return q?`<path d="${q}" fill="none" stroke="${col}" stroke-width="1.2" ${dash?'stroke-dasharray="3 3"':''} clip-path="url(#c${id})"/>`:''};
    g+=`<defs><clipPath id="c${id}"><rect x="${L}" y="${T}" width="${pw}" height="${ph}"/></clipPath></defs>`;
    if(ov.includes('bb'))g+=path(OX.bb.up,'var(--tx3)',1)+path(OX.bb.lo,'var(--tx3)',1);

    if(ov.includes('st'))g+=path(OX.st.line.map((v,j)=>OX.st.dir[j]===1?v:null),'var(--up)')+path(OX.st.line.map((v,j)=>OX.st.dir[j]===-1?v:null),'var(--dn)')}}

  // 매매 지점: 일·주봉에서 거래일이 속한 봉에 표시 (봉 날짜는 거래소 현지 날짜)

  pills.forEach(([y,v,col,k,out])=>{y=Math.max(T+8,Math.min(T+ph-8,y));g+=`<rect x="${W-R+2}" y="${(y-8).toFixed(1)}" width="${R-2}" height="16" rx="4" fill="${col}"/><text class="pl ${k}" x="${W-R+6}" y="${(y+3.5).toFixed(1)}">${out?(avg>hi?'↑':'↓'):''}${fP(v)}</text>`});

    if(full)return r==='1d'?hm:r==='5d'?md+' '+hm:`${t.getUTCFullYear()}.${md}`;return r==='1d'?hm:(r==='1y'||r==='5y')?`${String(t.getUTCFullYear()).slice(2)}.${p2(t.getUTCMonth()+1)}`:md};
  [0,n>>1,n-1].forEach((i,k)=>g+=`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${['start','middle','end'][k]}">${fx(i)}</text>`);
  PXD[id]={W,L,pw,n,d,fx,X,T,vb,marks,fP,usd,h};
  return `<div class="chart" data-px="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.name)} 주가 차트">${g}<line class="cur" x1="0" x2="0" y1="${T}" y2="${vb}" stroke="var(--tx3)" stroke-width="1" style="display:none"/></svg><div class="tip"></div></div>`;
}

  tip.style.display='block';const px=c.X(i)/c.W*rc.width;tip.style.left=Math.min(Math.max(0,px-tip.offsetWidth/2),rc.width-tip.offsetWidth)+'px';tip.style.top='-6px';

/* ================= 전략: 지표 엔진 (순수 함수 · 일봉 기준) ================= */
const TA=(()=>{
  const N=n=>new Array(n).fill(null);
  // 지수 평활(EMA·RMA): 앞쪽 null은 건너뛰고 첫 n개 단순평균으로 시작
  function smooth(a,n,alpha){const o=N(a.length);let s=0,cnt=0,e=null;
    for(let i=0;i<a.length;i++){const v=a[i];if(v==null){if(e!=null)o[i]=e;continue}
      if(e==null){s+=v;cnt++;if(cnt===n){e=s/n;o[i]=e}}else{e=alpha*v+(1-alpha)*e;o[i]=e}}return o}
  const ema=(a,n)=>smooth(a,n,2/(n+1)),rma=(a,n)=>smooth(a,n,1/n);
  function sma(a,n){const o=N(a.length),q=[];let s=0;for(let i=0;i<a.length;i++){const v=a[i];if(v==null)continue;q.push(v);s+=v;if(q.length>n)s-=q.shift();if(q.length===n)o[i]=s/n}return o}
  function std(a,n){const o=N(a.length),q=[];for(let i=0;i<a.length;i++){const v=a[i];if(v==null)continue;q.push(v);if(q.length>n)q.shift();
    if(q.length===n){const m=q.reduce((x,y)=>x+y,0)/n;o[i]=Math.sqrt(q.reduce((x,y)=>x+(y-m)*(y-m),0)/n)}}return o}
  const hhv=(a,from,to)=>{let m=-Infinity;for(let j=Math.max(0,from);j<=to;j++)if(a[j]>m)m=a[j];return m};
  const llv=(a,from,to)=>{let m=Infinity;for(let j=Math.max(0,from);j<=to;j++)if(a[j]<m)m=a[j];return m};
  const tr=(h,l,c)=>h.map((x,i)=>i?Math.max(x-l[i],Math.abs(x-c[i-1]),Math.abs(l[i]-c[i-1])):x-l[i]);
  const atr=(h,l,c,n)=>rma(tr(h,l,c),n);
  function rsi(c,n){const g=N(c.length),d=N(c.length);for(let i=1;i<c.length;i++){const ch=c[i]-c[i-1];g[i]=Math.max(ch,0);d[i]=Math.max(-ch,0)}
    const ag=rma(g,n),al=rma(d,n);return c.map((_,i)=>ag[i]==null?null:al[i]===0?100:100-100/(1+ag[i]/al[i]))}
  function macd(c,f,s,g){const a=ema(c,f),b=ema(c,s);const line=c.map((_,i)=>a[i]!=null&&b[i]!=null?a[i]-b[i]:null);const sig=ema(line,g);
    return {line,sig,hist:line.map((v,i)=>v!=null&&sig[i]!=null?v-sig[i]:null)}}

  function stoch(h,l,c,n,sk,sd){const raw=c.map((v,i)=>{if(i<n-1)return null;const hh=hhv(h,i-n+1,i),ll=llv(l,i-n+1,i);return hh===ll?50:(v-ll)/(hh-ll)*100});
    const k=sma(raw,sk);return {k,d:sma(k,sd)}}

  function supertrend(h,l,c,n,m){const at=atr(h,l,c,n),L=c.length,line=N(L),dir=N(L);let fu=null,fl=null,d=1;
    for(let i=0;i<L;i++){if(at[i]==null)continue;const hl2=(h[i]+l[i])/2,up=hl2-m*at[i],dn=hl2+m*at[i];

  // 같은 날짜(이전 가장 가까운 거래일) 종가
  function closeAt(X,ser){let lo=0,hi=X.L-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(X.ser[m]<=ser){r=m;lo=m+1}else hi=m-1}return r<0?null:X.c[r]}
  function retBetween(X,s0,s1){const a=closeAt(X,s0),b=closeAt(X,s1);return a&&b?b/a-1:null}
  function idxAt(X,ser){let lo=0,hi=X.L-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(X.ser[m]<=ser){r=m;lo=m+1}else hi=m-1}return r}
  return {idxAt,sma,ema,rma,std,rsi,macd,bb,stoch,atr,supertrend,adx,compute,hhv,llv,closeAt,retBetween};
})();

function finHist(tk,nowPer,f){const D=S.D,rs=(D&&D.finBy&&D.finBy[tk])||[],out={n:rs.length};if(!rs.length)return out;

  const old=rs.filter(o=>o.date<=today-28&&o.date>=today-45).pop();

    if(S.pinFirst!==pin){S.pinFirst='';S.pin='';S.pinMsg='PIN이 일치하지 않습니다. 다시 설정하세요';render();shake();return}
    await setPin(pin);S.pinFirst='';S.pin='';S.pinMsg='';const wasChange=S.pinMode==='change';S.pinMode='unlock';

function closedInfo(h){
  const buys=h.trades.filter(t=>t.type==='매수'),sells=h.trades.filter(t=>t.type==='매도');
  const buy=buys.reduce((a,t)=>a+num(t.amount),0),sell=sells.reduce((a,t)=>a+num(t.amount),0);
  const ds=h.trades.map(t=>num(t.date)).filter(Boolean);
  const first=ds.length?Math.min(...ds):0,last=sells.length?Math.max(...sells.map(t=>num(t.date))):(ds.length?Math.max(...ds):0);
  /* 마지막 보유 구간: 수량이 0에서 시작해 다시 0이 된 구간 */
  let st=0,pst=0;h.trades.forEach(t=>{const pc=num(t.cum)+(t.type==='매도'?Math.abs(num(t.qty)):-Math.abs(num(t.qty)));if(Math.abs(pc)<1e-9&&t.type==='매수')st=num(t.date);if(Math.abs(num(t.cum))<1e-9&&t.type==='매도')pst=st});
  return {buy,sell,first,last,lastStart:pst||first,days:last&&(pst||first)?Math.round(last-(pst||first)):0,rate:buy?h.realized/buy:0,nb:buys.length,ns:sells.length};
}

function tradeStats(m){
  const sells=[];S.D.mk[m].holdings.forEach(h=>h.trades.forEach(t=>{if(t.type==='매도')sells.push({h,t})}));
  const w=sells.filter(x=>x.t.realized>0),l=sells.filter(x=>x.t.realized<0);
  const sw=sum(w,x=>x.t.realized),sl=sum(l,x=>x.t.realized);
  const buys=S.D.mk[m].holdings.reduce((a,h)=>a+h.trades.filter(t=>t.type==='매수').length,0);
  const best=sells.slice().sort((a,b)=>b.t.realized-a.t.realized);
  return {n:sells.length,buys,win:sells.length?w.length/sells.length:0,avgW:w.length?sw/w.length:0,avgL:l.length?sl/l.length:0,pf:sl?sw/Math.abs(sl):0,best:best[0],worst:best[best.length-1],sw,sl};
}

function tRb(){
  const D=S.D,sc=S.v.rbs,inc=S.v.rbc==='1';const hs=D.hold.filter(h=>h.active&&(sc==='ALL'||h.mkt===sc));const c=sc==='US'?'USD':'KRW';
  const val=h=>sc==='ALL'?h.vK:h.value;const cash=sc==='ALL'?D.sum.TOT.cash:D.sum[sc].cash;

   ${inc?`<div class="xs faint" style="margin-top:8px">목표% 합이 100% 미만이면 나머지는 예수금으로 남습니다. 수량은 현재가 기준(소수점 버림)${sc==='ALL'?', 미장은 현재환율 환산':''}.</div>`:''}

function calcRun(box){
  const k=box.dataset.calc,v=fv(box),c=v.ccy||'KRW',n=k=>num(v[k]);const out=$('#calcOut',box);if(!out)return;
  const R=(l,x,cl='')=>`<div class="row"><span class="muted">${l}</span><b class="num ${cl}">${x}</b></div>`;
  if(k==='avg'){const q0=n('q0'),a0=n('a0'),add=n('n'),p=n('p'),cur=n('cur'),tg=n('tgt');let h='';
    if(add>0){const na=(q0*a0+add*p)/(q0+add);h+=R('추가 매수금액',fmtMoney(add*p,c))+R('새 평균단가',fmtMoney(na,c))+R('평단 변화',fmtPct(a0?na/a0-1:0,{d:2}),cls(na-a0))+R('새 보유수량',fmtQty(q0+add)+'주')+R('현재가 기준 수익률',fmtPct(na?cur/na-1:0,{d:2}),cls(cur-na))}
    if(tg>0){if((tg<a0&&p<tg)||(tg>a0&&p>tg)){const need=q0*(a0-tg)/(tg-p);h+=`<div style="height:8px"></div>`+R(`평단 ${fmtMoney(tg,c)} 필요 수량`,fmtQty(Math.ceil(need*100)/100)+'주')+R('필요 금액',fmtMoney(need*p,c))}else h+=`<div class="err">목표 평단은 현재 평단과 매수 단가 사이여야 합니다</div>`}
    out.innerHTML=h||'<span class="muted">추가 매수 수량 또는 목표 평단을 입력하세요</span>'}
  else if(k==='sell'){const q0=n('q0'),a0=n('a0'),q=n('n'),p=n('p'),fr=calcFee(v.mkt,str(v.acc),'매도',toSerial(todayStr()),q,p),fee=fr.fee;
    if(q>q0+1e-9){out.innerHTML='<div class="err">보유수량보다 많습니다</div>';return}
    const proceeds=q*p-fee,real=proceeds-q*a0;
    out.innerHTML=R('매도금액',fmtMoney(q*p,c))+R('수수료+세금',fmtMoney(fee,c))+`<div class="xs faint" style="text-align:right">${esc(fr.desc)}</div>`+R('정산금액',fmtMoney(proceeds,c))+R('실현손익',fmtMoney(real,c,{sign:true}),cls(real))+R('수익률',fmtPct(q*a0?real/(q*a0):0,{d:2}),cls(real))+R('남은 수량',fmtQty(q0-q)+'주')+R('남은 평가금액(매도가 기준)',fmtMoney((q0-q)*p,c))}
  else if(k==='size'){const cap=n('cap'),r=n('risk'),e=n('e'),st=n('st'),tg=n('tg');
    if(!(e>0&&st>0)){out.innerHTML='<span class="muted">진입가와 손절가를 입력하세요</span>';return}
    if(st>=e){out.innerHTML='<div class="err">손절가는 진입가보다 낮아야 합니다</div>';return}
    const loss=cap*r/100,per=e-st,q=Math.floor(loss/per),amt=q*e;
    out.innerHTML=R('허용 손실액',fmtMoney(loss,c))+R('주당 위험',fmtMoney(per,c)+` (${fmtPct(per/e,{sign:false,d:2})})`)+R('매수 가능 수량',fmtQty(q)+'주')+R('매수 금액',fmtMoney(amt,c))+R('자산 대비 비중',fmtPct(cap?amt/cap:0,{sign:false}))+(tg>e?R('손익비',((tg-e)/per).toFixed(2))+R('목표 도달 시 이익',fmtMoney(q*(tg-e),c,{sign:true}),'up'):'')}
}

// 환전 입력: 기준율·증권사·일자가 바뀌면 우대 환율 재계산(직접 고친 환율은 유지), 마지막으로 입력한 통화 기준으로 반대쪽 금액 계산
function ffCalc(src){
  const el=$('#modal .sheet');if(!el||!S.ff||!isFxT(S.ff.type))return;const q=n=>$(`[name=${n}]`,el);
  if(src==='usd'||src==='krw')S.ff.last=src;if(src==='fx')S.ff.fxManual=true;
  if(src==='base'||src==='acc'||src==='date'){const r=calcFx(q('acc').value,S.ff.type,toSerial(q('date').value),num(q('base').value));
    if(!S.ff.fxManual&&r.rate)q('fx').value=r.rate.toFixed(2);const h=$('#ffHint',el);if(h)h.textContent=r.desc+(r.rate?` → ${fmtNum(r.rate)}원`:'')}
  const fx=num(q('fx').value);if(!fx)return;
  if(S.ff.last==='usd'){const u=num(q('usd').value);if(u)q('krw').value=Math.round(u*fx)}
  else{const k=num(q('krw').value);if(k)q('usd').value=(Math.round(k/fx*100)/100).toFixed(2)}
}
// 티커 입력: 거래소 셀렉트 + 코드. 기타는 거래소:코드 전체 입력(NYSEARCA:SOXL 등)
const TKX={KR:['KRX'],US:['NASDAQ','NYSE']},TKPH={KRX:'005380',NASDAQ:'AMD',NYSE:'TSM','':'NYSEARCA:SOXL'};
function tkField(list,def){
  return `<div class="fld" data-tk><span>티커</span><div class="tkrow"><select name="exch" aria-label="거래소">${list.map(x=>`<option value="${x}" ${x===def?'selected':''}>${x}</option>`).join('')}<option value="">직접 입력</option></select>
   <input name="code" maxlength="30" placeholder="${TKPH[def]}" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="종목 코드"></div><div class="hint" data-tkh>${tkHintText(def,'')}</div></div>`}
function tkVal(v){const c=str(v.code).toUpperCase().replace(/\s/g,'');if(!c)return '';return c.includes(':')||!v.exch?c:v.exch+':'+c}
function tkHintText(ex,t){return t?`저장 형식: ${esc(t)}`:ex==='KRX'?'6자리 종목코드 (예: 005380, ETF 0193T0)':ex?'종목 기호 (예: '+TKPH[ex]+')':'거래소:코드 전체 입력 (예: NYSEARCA:SOXL, KOSDAQ:035720)'}
function tkSync(box){const ex=$('[name=exch]',box).value,ci=$('[name=code]',box);ci.placeholder=TKPH[ex];$('[data-tkh]',box).innerHTML=tkHintText(ex,tkVal({exch:ex,code:ci.value}))}
function tkCheck(v){const t=tkVal(v);if(!t)return[t,'티커(종목 코드)를 입력하세요'];
  if(!/^[A-Z]+:[A-Z0-9.\-]+$/.test(t))return[t,'티커는 거래소:코드 형식입니다 (예: KRX:005380, NASDAQ:AMD)'];
  if(/^KRX:/.test(t)&&!/^KRX:[0-9A-Z]{6}$/.test(t))return[t,'KRX 코드는 6자리입니다 (예: 005380, 0193T0)'];
  return[t,'']}

    const sel={'1d':()=>intra(1,5),'5d':()=>intra(5,30),'1mo':()=>bars.slice(-22),'3mo':()=>bars.slice(-64),'1y':()=>bars.slice(-250),'5y':()=>wk(bars),'2y':()=>bars.slice(-500),'5yd':()=>bars}[r]();

    // 회계연도별 추정 EPS·12개월 선행 EPS (국장 12월, 미장 9월 결산으로 가정). 추정치 변화는 미장만 (국장은 기록으로 계산)
    const e0=kr?'2026-12-31':'2027-09-30',e1=kr?'2027-12-31':'2028-09-30',g=.08+rnd()*.25,f0=px/fper/(1+g*.4),f1=f0*(1+g);

  // 가상 재무 기록: 최근 150 평일 (국장 추정치 변화·선행 PER 1년 위치를 데모에서 볼 수 있게)
