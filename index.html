<script>
'use strict';
/* ================= 상수 / 유틸 ================= */
const VERSION='1.1.2';
const SH='https://sheets.googleapis.com/v4/spreadsheets';
const SHEETS_SCOPE='https://www.googleapis.com/auth/spreadsheets';
const SCOPES=SHEETS_SCOPE+' openid email';
const APP={plan:'App_매매계획',review:'App_매매회고',snap:'App_자산추이'};
const CASH='현금투자';
const HDR={
  plan:['종목코드','시장','종목탭','목표가','손절가','목표비중(%)','투자근거','메모','수정일'],
  review:['거래키','시장','종목탭','거래일자','구분','수량','단가','전략태그','감정','회고','평점','작성일'],
  snap:['일자','투자원금(KRW)','총평가자산(KRW)','총손익(KRW)','수익률','국장 총평가(KRW)','미장 총평가(USD)','예수금(KRW환산)','환율(USD/KRW)','국장 원금(KRW)','미장 원금(USD)','기록시각']
};

function feeRule(m,acc){
  const saved=(S.cfg.fees||{})[m+'|'+acc];if(saved)return Object.assign({b:0,s:0,sec:'',min:'',until:'',after:''},saved);
  const d=Object.entries(FEE_DEF).find(([k])=>{const [mm,br]=k.split('|');return mm===m&&String(acc).includes(br)});
  return Object.assign({},d?d[1]:{b:0,s:0,sec:'',min:'',until:'',after:''});
}
// 환전 적용 환율 = 매매기준율 × (1 ± 기본 스프레드 × (1 − 우대율)). 달러 매수는 +, 달러 매도는 −. 0.01원 단위 반올림
function fxRule(acc){
  const saved=(S.cfg.fxp||{})[acc];if(saved)return Object.assign({spread:1,pref:0,until:'',after:''},saved);
  const d=Object.entries(FXP_DEF).find(([br])=>String(acc).includes(br));
  return Object.assign({spread:1,pref:0,until:'',after:''},d?d[1]:{});
}
function calcFx(acc,type,date,base){
  const r=fxRule(acc);const expired=!!(r.until&&date&&date>toSerial(r.until));
  const pref=expired&&str(r.after)!==''?num(r.after):num(r.pref);
  const sp=Math.max(0,num(r.spread)*(1-pref/100))/100;const buy=type==='달러 매수';
  const rate=base?Math.round(base*(buy?1+sp:1-sp)*100)/100:0;
  return {rate,pref,desc:`${acc||'계좌 미지정'} 우대 ${fmtNum(pref,2)}%${r.until?(expired?` (${r.until} 이후)`:` (~${r.until})`):''} · 스프레드 ${fmtNum(sp*100,4)}%`};
}
// 수수료 계산: 국장은 원 단위 절사, 미장 수수료는 센트 반올림, SEC Fee는 센트 올림(최소금액 적용)
function calcFee(m,acc,type,date,qty,price){
  const r=feeRule(m,acc),amt=Math.abs(num(qty))*num(price),sell=type==='매도';
  const expired=!!(r.until&&date&&date>toSerial(r.until));
  let rate=num(sell?r.s:r.b);if(expired&&str(r.after)!=='')rate=num(r.after);
  const parts=[];let fee=m==='KR'?Math.floor(amt*rate/100+1e-9):Math.round(amt*rate+1e-9)/100;
  parts.push(`${acc||'계좌 미지정'} ${fmtNum(rate,4)}%${r.until?(expired?` (${r.until} 이후 요율)`:` (~${r.until})`):''}`);
  if(sell&&m==='US'&&num(r.sec)>0&&amt>0){const sec=Math.max(num(r.min),Math.ceil(amt*num(r.sec)-1e-9)/100);fee+=sec;parts.push(`SEC ${fmtMoney(sec,'USD')}`)}
  if(sell&&m==='KR'&&num(S.cfg.taxKRsell)>0&&amt>0){const t=Math.floor(amt*num(S.cfg.taxKRsell)/100+1e-9);fee+=t;parts.push(`거래세 ${fmtNum(S.cfg.taxKRsell,4)}%`)}
  if(m==='US')fee=Math.round(fee*100)/100;
  return {fee,desc:parts.join(' + ')};
}
function calcTrades(trades){
  let cum=0,avg=0;
  return trades.map(t=>{
    const q=Math.abs(num(t.qty)),p=num(t.price),f=num(t.fee),sell=t.type==='매도';
    const amount=sell?q*p-f:q*p+f;let realized=0;const pc=cum,pa=avg;
    if(sell){cum=pc-q;realized=amount-q*pa;avg=Math.abs(cum)<1e-9?0:pa}
    else{cum=pc+q;avg=cum?(pc*pa+amount)/cum:0}
    return Object.assign({},t,{amount,cum,avg,realized});
  });
}

function parseCash(v){
  const o={baseDate:0,baseFx:0,fxEffect:null,fxRealized:0,principalUSKRW:0,missing:'',flows:[],flowStart:0,flowOld:false,KR:{acc:[],total:null,principal:0},US:{acc:[],total:null,principal:0}};
  const ro=r=>({name:str(r[0]),invest:num(r[1]),cash:num(r[2]),total:num(r[3]),weight:num(r[4]),baseCash:num(r[5]),realizedAfter:num(r[6]),netFlow:num(r[7])});
  let sec=null,inAcc=false,inFlow=false;
  v.forEach((r,i)=>{r=r||[];const a=str(r[0]);
    if(!o.flowStart){const c=str(r[2]);if(c.startsWith('환차손익'))o.fxEffect=num(r[3]);else if(c.startsWith('환전 실현손익'))o.fxRealized=num(r[3])}
    if(o.flowStart){if(i+1>=o.flowStart&&(a||str(r[1])||str(r[2])))o.flows.push({row:i+1,date:toSerial(r[0]),type:str(r[1]),acc:str(r[2]),krw:num(r[3]),fx:num(r[4]),usd:num(r[5]),memo:str(r[6])});return}
    if(a==='기준일')o.baseDate=toSerial(r[1]);
    else if(a.startsWith('원화 계좌')){sec='KR';inAcc=false}
    else if(a.startsWith('달러 계좌')){sec='US';inAcc=false}
    else if(a.startsWith('입출금')){sec=null;inFlow=true}
    else if(inFlow&&a==='일자'){if(str(r[1])==='구분')o.flowStart=i+2;else o.flowOld=true}
    else if(sec&&a==='계좌')inAcc=true;
    else if(sec&&a==='합계'){o[sec].total=ro(r);inAcc=false}
    else if(sec&&inAcc&&a)o[sec].acc.push(ro(r));
    else if(sec&&a==='투자 원금')o[sec].principal=num(r[1]);
    else if(a.startsWith('기준 환율'))o.baseFx=num(r[1]);
    else if(a.startsWith('투자 원금 (원화'))o.principalUSKRW=num(r[1]);
    else if(a.startsWith('목록에 없는'))o.missing=str(r[1]);
  });
  return o;
}

function parseSummary(v){
  const G=x=>{x=str(x);if(/^국장/.test(x))return 'KR';if(/^미장/.test(x))return /원화/.test(x)?'USKRW':'US';if(/^합계/.test(x))return /USD|달러/.test(x)?'TOTUSD':'TOT';return null};
  const MET={'투자 원금':'principal','매수금액':'cost','평가금액':'value','예수금':'cash','총 평가자산':'total','총 손익':'pnl','수익률':'rr','누적 실현손익':'realized'};
  const mk=x=>MET[str(x).replace(/\s+/g,' ')]||null;
  const out={};['KR','US','USKRW','TOT','TOTUSD'].forEach(k=>out[k]={principal:0,cost:0,value:0,cash:0,total:0,pnl:0,rr:0,realized:0});
  let found=0;const hi=v.findIndex(r=>r&&str(r[0])==='요약');
  if(hi>=0){const h=v[hi]||[];
    if(h.slice(1).some(G)){for(let i=hi+1;i<v.length;i++){const r=v[i]||[];const m=mk(r[0]);if(!m)continue;h.forEach((c,j)=>{const g=j&&G(c);if(g){out[g][m]=num(r[j]);found++}})}}
    else if(h.slice(1).some(mk)){for(let i=hi+1;i<v.length;i++){const r=v[i]||[];const g=G(r[0]);if(!g)continue;h.forEach((c,j)=>{const m=j&&mk(c);if(m){out[g][m]=num(r[j]);found++}})}}}
  if(!found)throw new Error("'총자산' 시트에서 요약 표를 찾지 못했습니다 (A열에 '요약' 헤더 필요)");
  return out;
}
function buildData(raw){
  const D={asOf:new Date(),fx:num(raw.fx),mainS:raw.mainS,has:raw.has,mk:{},byKey:{}};
  ['KR','US'].forEach(m=>{const r=raw.mk[m];const order=[...r.list.filter(t=>r.tabs[t]),...Object.keys(r.tabs).filter(t=>!r.list.includes(t))];
    const hs=[];order.forEach(t=>{const h=parseTab(m,t,r.tabs[t].vals,r.tabs[t].sheetId);if(h){h.listed=r.list.includes(t);hs.push(h)}});
    D.mk[m]={holdings:hs,list:r.list,sheetIds:r.sheetIds,listCount:r.list.length}});
  const all=[...D.mk.KR.holdings,...D.mk.US.holdings];
  all.forEach(h=>{const k=h.ccy==='USD'?D.fx:1;h.vK=h.value*k;h.cK=h.cost*k;h.pK=h.pnl*k;h.active=h.qty>1e-9;
    const acc={};h.trades.forEach(t=>{const a=t.acc||'(미지정)';acc[a]=(acc[a]||0)+(t.type==='매도'?-Math.abs(t.qty):Math.abs(t.qty))});h.accQty=acc;
    const c=calcTrades(h.trades);const lc=c[c.length-1];
    h.mismatch=!!(lc&&(Math.abs(lc.cum-h.qty)>1e-6||Math.abs(lc.avg-h.avg)>Math.max(0.01,Math.abs(h.avg)*1e-6)));
    h.unsorted=h.trades.some((t,i)=>i&&t.date<h.trades[i-1].date);
    h.lev=isLev(h);D.byKey[h.key]=h});
  D.hold=all;
  const tv=sum(all.filter(h=>h.active),'vK');D.totHoldK=tv;all.forEach(h=>h.wAll=tv?h.vK/tv:0);
  ['KR','US'].forEach(m=>{const hs=D.mk[m].holdings;const mv=sum(hs.filter(h=>h.active),'value');hs.forEach(h=>h.wMk=mv?h.value/mv:0)});
  D.sum=parseSummary(raw.sum);
  D.cash=parseCash(raw.cash);
  D.acc={KR:D.cash.KR.acc.map(a=>a.name),US:D.cash.US.acc.map(a=>a.name)};
  ['KR','US'].forEach(m=>{if(!D.acc[m].length)D.acc[m]=DEF_ACC[m].slice()});
  D.flows=D.cash.flows;D.has.flow=!!D.cash.flowStart;
  D.plans={};raw.plan.forEach((r,i)=>{const k=str(r[0]);if(k)D.plans[k]={row:i+2,key:k,target:num(r[3]),stop:num(r[4]),wt:num(r[5]),thesis:str(r[6]),memo:str(r[7]),updated:str(r[8])}});
  D.reviews={};raw.review.forEach((r,i)=>{const k=str(r[0]);if(k)D.reviews[k]={row:i+2,key:k,mkt:str(r[1]),tab:str(r[2]),date:toSerial(r[3]),type:str(r[4]),qty:num(r[5]),price:num(r[6]),tags:str(r[7]).split(',').map(s=>s.trim()).filter(Boolean),emo:str(r[8]),text:str(r[9]),rating:num(r[10]),at:str(r[11])}});
  D.snaps=raw.snap.map((r,i)=>({row:i+2,date:toSerial(r[0]),principal:num(r[1]),total:num(r[2]),pnl:num(r[3]),rr:num(r[4]),kr:num(r[5]),us:num(r[6]),cash:num(r[7]),fx:num(r[8]),krP:num(r[9]),usP:num(r[10]),ts:r[11]})).filter(s=>s.date&&s.total).sort((a,b)=>a.date-b.date);
  return D;
}
async function load(silent){
  if(S.loading)return;S.loading=true;S.err='';if(!silent||!S.D)render();else spinRefresh(true);
  try{S.D=buildData(await fetchAll());S.needAuth=false;autoSnap()}
  catch(e){if(e.auth)S.needAuth=true;else S.err=e.message||String(e)}
  S.loading=false;render();
}

const fF=n=>`=IF($B${n}="","",IF($B${n}="매도",ABS($C${n})*$D${n}-$E${n},$C${n}*$D${n}+$E${n}))`;
const fG=n=>`=IF($B${n}="","",N(G${n-1})+IF($B${n}="매도",-ABS($C${n}),ABS($C${n})))`;
const fH=n=>`=IF($B${n}="","",IF($B${n}="매도",IF(G${n}=0,0,N(H${n-1})),(N(G${n-1})*N(H${n-1})+$F${n})/G${n}))`;
const fI=n=>`=IF($B${n}="","",IF($B${n}="매도",$F${n}-ABS($C${n})*N(H${n-1}),0))`;
const Store={
  fid(m){return ids()[m]},
  async freshRows(h){const rows=await getVals(this.fid(h.mkt),`${qn(h.tab)}!A9:K`);const last=8+rows.length;
    if(last!==h.lastRow)throw new Error('시트가 다른 곳에서 변경되었습니다. 새로고침 후 다시 시도하세요.');return {rows,last}},
  async ensureF(h,n){const id=this.fid(h.mkt);const f=await getVals(id,`${qn(h.tab)}!F${n}:I${n}`,'FORMULA');
    if(!(f[0]&&String(f[0][0]||'').startsWith('=')))await batchUpdateVals(id,[{range:`${qn(h.tab)}!F${n}:I${n}`,values:[[fF(n),fG(n),fH(n),fI(n)]]}])},
  inA:t=>[sToStr(t.date),t.type,t.qty,t.price,t.fee],
  inJ:t=>[safeText(t.acc),safeText(t.memo)],
  rA:r=>[typeof r[0]==='number'?sToStr(r[0]):(r[0]??''),r[1]??'',r[2]??'',r[3]??'',r[4]??''],
  rJ:r=>[r[9]??'',safeText(r[10]??'')],
  insertPos(h,t){const later=h.trades.find(x=>x.date>t.date);return later?later.row:h.lastRow+1},
  async insertTrade(h,t){
    const {rows,last}=await this.freshRows(h);const id=this.fid(h.mkt),T=qn(h.tab);
    const later=rows.map((r,i)=>({row:9+i,r})).find(x=>(x.r[1]==='매수'||x.r[1]==='매도')&&toSerial(x.r[0])>t.date);
    const at=later?later.row:last+1;
    const blk=rows.slice(at-9);
    const A=[this.inA(t),...blk.map(this.rA)],J=[this.inJ(t),...blk.map(this.rJ)];
    await batchUpdateVals(id,[{range:`${T}!A${at}:E${last+1}`,values:A},{range:`${T}!J${at}:K${last+1}`,values:J}]);
    await this.ensureF(h,last+1);return at;
  },
  async updateTrade(h,orig,t){
    const {rows}=await this.freshRows(h);const r=rows[orig.row-9]||[];
    if(toSerial(r[0])!==orig.date||str(r[1])!==orig.type||num(r[2])!==num(orig.qty))throw new Error('대상 행이 변경되었습니다. 새로고침 후 다시 시도하세요.');
    const T=qn(h.tab);await batchUpdateVals(this.fid(h.mkt),[{range:`${T}!A${orig.row}:E${orig.row}`,values:[this.inA(t)]},{range:`${T}!J${orig.row}:K${orig.row}`,values:[this.inJ(t)]}]);
  },
  async deleteTrade(h,orig){
    const {rows,last}=await this.freshRows(h);const r=rows[orig.row-9]||[];
    if(toSerial(r[0])!==orig.date||str(r[1])!==orig.type||num(r[2])!==num(orig.qty))throw new Error('대상 행이 변경되었습니다. 새로고침 후 다시 시도하세요.');
    const id=this.fid(h.mkt),T=qn(h.tab);const blk=rows.slice(orig.row-9+1);
    if(blk.length)await batchUpdateVals(id,[{range:`${T}!A${orig.row}:E${last-1}`,values:blk.map(this.rA)},{range:`${T}!J${orig.row}:K${last-1}`,values:blk.map(this.rJ)}]);
    await batchClear(id,[`${T}!A${last}:E${last}`,`${T}!J${last}:K${last}`]);
  },
  async newTicker(m,o){
    const id=this.fid(m);const mk=S.D.mk[m];const src=mk.holdings[0];
    if(!src)throw new Error('복제할 기존 종목 탭이 없습니다');
    if(mk.sheetIds[o.tab]!=null)throw new Error('같은 이름의 탭이 이미 있습니다');
    const r=await ssBatch(id,[{duplicateSheet:{sourceSheetId:src.sheetId,newSheetName:o.tab,insertSheetIndex:mk.holdings.length}}]);
    const T=qn(o.tab);
    await batchClear(id,[`${T}!A9:E`,`${T}!J9:K`]);
    await batchUpdateVals(id,[{range:`${T}!B1:B3`,values:[[safeText(o.name)],[o.ticker],[`=IFERROR(GOOGLEFINANCE(B2, "price"), ${num(o.fallback)})`]]}]);
    await sleep(1200);
    const list=(await getVals(id,`${qn('종목목록')}!A2:A`)).map(x=>str(x[0])).filter(Boolean);
    if(!list.includes(o.tab))await batchUpdateVals(id,[{range:`${qn('종목목록')}!A${list.length+2}`,values:[[o.tab]]}]);
    return r;
  },
  async rowOf(k,key){const col=await getVals(ids().main,`${qn(APP[k])}!A:A`);const i=col.findIndex(r=>str(r[0])===key);return {row:i>=0?i+1:Math.max(2,col.length+1),exists:i>=0}},
  async upsert(k,key,vals){if(!S.D.has[k])throw new Error(APP[k]+' 시트가 없습니다. 설정에서 앱 시트를 먼저 만드세요.');
    const {row}=await this.rowOf(k,key);await batchUpdateVals(ids().main,[{range:`${qn(APP[k])}!A${row}:${HCOL[k]}${row}`,values:[vals]}]);return row},
  async delRow(k,key){const {row,exists}=await this.rowOf(k,key);if(!exists)return;const sid=S.D.mainS[APP[k]];
    await ssBatch(ids().main,[{deleteDimension:{range:{sheetId:sid,dimension:'ROWS',startIndex:row-1,endIndex:row}}}])},
  // 입출금·환전: '현금투자' 시트 하단 표(헤더 '일자'·'구분' 다음 행부터, A:G = 일자·구분·계좌·원화 금액·적용 환율·달러 금액·메모)에 직접 기록
  async flowRows(){const st=S.D.cash.flowStart;if(!st)throw new Error("'현금투자' 시트에서 입출금·환전 내역 표(헤더 '일자'·'구분')를 찾지 못했습니다");
    const T=qn(CASH);const [hdr,rows]=await Promise.all([getVals(ids().main,`${T}!A${st-1}:B${st-1}`),getVals(ids().main,`${T}!A${st}:G`)]);
    const h=hdr[0]||[];if(str(h[0])!=='일자'||str(h[1])!=='구분')throw new Error('현금투자 시트 구조가 바뀌었습니다. 새로고침 후 다시 시도하세요.');
    if(st+rows.length-1!==(S.D.flows.length?Math.max(...S.D.flows.map(x=>x.row)):st-1))throw new Error('입출금 내역이 다른 곳에서 변경되었습니다. 새로고침 후 다시 시도하세요.');
    return {st,rows}},
  flowVals:f=>[sToStr(f.date),f.type,f.acc,f.krw||'',f.fx||'',f.usd||'',safeText(f.memo)],
  async addFlow(f){const {st,rows}=await this.flowRows();const row=st+rows.length;
    await batchUpdateVals(ids().main,[{range:`${qn(CASH)}!A${row}:G${row}`,values:[this.flowVals(f)]}])},
  async delFlow(f){const {st,rows}=await this.flowRows();const i=f.row-st;const r=rows[i]||[];
    if(toSerial(r[0])!==f.date||str(r[1])!==f.type||str(r[2])!==f.acc)throw new Error('대상 행이 변경되었습니다. 새로고침 후 다시 시도하세요.');
    const T=qn(CASH),last=st+rows.length-1;
    const below=rows.slice(i+1).map(x=>{const y=[...x];while(y.length<7)y.push('');if(typeof y[0]==='number')y[0]=sToStr(y[0]);y[6]=safeText(y[6]);return y.slice(0,7)});
    if(below.length)await batchUpdateVals(ids().main,[{range:`${T}!A${f.row}:G${last-1}`,values:below}]);
    await batchClear(ids().main,[`${T}!A${last}:G${last}`])},
  async createAppSheets(miss){
    const id=ids().main;await ssBatch(id,miss.map(k=>({addSheet:{properties:{title:APP[k],gridProperties:{frozenRowCount:1}}}})));
    await batchUpdateVals(id,miss.map(k=>({range:`${qn(APP[k])}!A1:${HCOL[k]}1`,values:[HDR[k]]})));
  },
  snapRow(){const D=S.D,s=D.sum;return [todayStr(),s.TOT.principal,s.TOT.total,s.TOT.pnl,s.TOT.rr,s.KR.total,s.US.total,s.TOT.cash,D.fx,s.KR.principal,s.US.principal,"'"+nowStr()]},
  async snapshot(){return this.upsert('snap',todayStr(),this.snapRow())}
};
// 날짜를 키로 쓰는 자산추이는 A열이 날짜 serial로 저장되므로 별도 조회
Store.rowOf=(function(orig){return async function(k,key){
  if(k!=='snap')return orig.call(this,k,key);
  const col=await getVals(ids().main,`${qn(APP.snap)}!A:A`);const ks=toSerial(key);
  const i=col.findIndex((r,j)=>j>0&&toSerial(r[0])===ks);return {row:i>=0?i+1:Math.max(2,col.length+1),exists:i>=0};
}})(Store.rowOf);

async function autoSnap(){
  const D=S.D;if(!D||!D.has.snap||!S.cfg.autoSnap||!D.sum.TOT.total)return;
  const t=toSerial(todayStr());const last=D.snaps.find(s=>s.date===t);
  if(last){const ts=typeof last.ts==='number'?EPOCH+last.ts*864e5-9*36e5:Date.parse(String(last.ts).replace(' ','T'));if(isFinite(ts)&&Date.now()-ts<30*60000)return}
  try{await Store.snapshot();const row=Store.snapRow();const o={date:t,principal:row[1],total:row[2],pnl:row[3],rr:row[4],kr:row[5],us:row[6],cash:row[7],fx:row[8],krP:row[9],usP:row[10],ts:nowStr()};
    D.snaps=D.snaps.filter(s=>s.date!==t).concat(o).sort((a,b)=>a.date-b.date);if(S.v.tab==='home'||S.v.tab==='anal')render()}catch(e){console.warn('snapshot',e)}
}

/* ================= 보안: PIN / 지문 / 자동잠금 ================= */
async function pbkdf(pin,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},k,256)))}
async function setPin(pin){const salt=rand(16),iter=210000;LS.set('sj.pin',{salt:b64(salt),iter,hash:await pbkdf(pin,salt,iter)});LS.del('sj.fail')}
async function checkPin(pin){const p=LS.get('sj.pin');if(!p)return false;const h=await pbkdf(pin,unb64(p.salt),p.iter);let d=h.length^p.hash.length;for(let i=0;i<h.length;i++)d|=h.charCodeAt(i)^(p.hash.charCodeAt(i)||0);return d===0}
const failState=()=>LS.get('sj.fail',{n:0,until:0});
function regFail(){const f=failState();f.n++;if(f.n>=5)f.until=Date.now()+Math.min(3600e3,30e3*Math.pow(2,f.n-5));LS.set('sj.fail',f)}
const bioAvail=async()=>{try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}};
async function bioRegister(){
  const cred=await navigator.credentials.create({publicKey:{challenge:rand(32),rp:{name:'주식일지'},user:{id:rand(16),name:'stock-journal',displayName:'주식일지'},
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
  LS.set('sj.bio',{id:b64(new Uint8Array(cred.rawId))});
}
async function bioUnlock(){
  const b=LS.get('sj.bio');if(!b)return false;
  const a=await navigator.credentials.get({publicKey:{challenge:rand(32),allowCredentials:[{type:'public-key',id:unb64(b.id)}],userVerification:'required',timeout:60000}});
  return !!(a&&a.response&&a.response.authenticatorData&&(new Uint8Array(a.response.authenticatorData)[32]&0x04));
}

/* ================= 뒤로가기 =================
   Android 뒤로가기(물리키·제스처)는 CloseWatcher로 받는다(Chrome 120+). 화면 이동에 history 기록을 쓰지 않아
   앱의 기록이 1개로 유지되므로 window.close()로 앱을 닫을 수 있고, 시스템의 '홈으로' 전환 애니메이션도 생기지 않는다.
   CloseWatcher가 없는 브라우저는 기존처럼 history 기록으로 화면 뒤로가기만 처리한다(홈에서는 브라우저 기본 동작). */
const NAV={cw:null,on:typeof window.CloseWatcher==='function',exiting:false};
function navArm(){
  if(!NAV.on||NAV.cw||NAV.exiting||NAV.exitAsk)return;
  try{const w=new CloseWatcher();w.onclose=()=>{if(NAV.cw===w)NAV.cw=null;onBack();navArm()};NAV.cw=w}catch(e){NAV.on=false}
}
const navPush=st=>{if(NAV.on)navArm();else history.pushState(st,'')};
function onBack(){
  if(S.dlgRes){closeDlg();return}                       // 확인창 → 취소
  if(S.modal){closeModal(true);return}                  // 입력 시트 닫기
  if(S.v.stock){S.v.stock=null;render();return}         // 종목 상세 → 목록
  if(S.v.tab!=='home'&&!S.locked){S.v.tab='home';render();window.scrollTo(0,0);return}
  if(NAV.on)askExit();
}
const navRelease=()=>{if(NAV.cw){const w=NAV.cw;NAV.cw=null;w.destroy()}};
async function askExit(){
  // 확인창이 떠 있는 동안은 뒤로가기 감시를 풀어 둔다 → 뒤로가기를 누르면 시스템이 앱을 닫음(= 종료 버튼)
  NAV.exitAsk=true;navRelease();
  const ok=await confirmBox('앱 종료','주식일지를 종료할까요?','종료');
  NAV.exitAsk=false;
  if(!ok){navArm();return}
  NAV.exiting=true;navRelease();
  window.close();
  // 브라우저 탭처럼 스크립트로 닫을 수 없는 창이면 감시를 해제한 채로 둔다 → 다음 뒤로가기는 시스템이 처리해 종료
  setTimeout(()=>{if(document.visibilityState==='visible'){toast('뒤로 버튼을 한 번 더 누르면 종료됩니다',3000);NAV.exiting=false;NAV.rearm=true}},350);
}
// 앱을 계속 쓰면 다시 뒤로가기를 받도록 감시를 건다
['pointerup','keydown'].forEach(e=>document.addEventListener(e,()=>{if(NAV.on&&!NAV.cw&&!NAV.exiting){NAV.rearm=false;navArm()}},true));

  if(S.skipPop){S.skipPop=false;return}
  if(!NAV.on)onBack();
});

const CH={};
function lineChart(id,series,o={}){
  const W=340,H=o.h||170,L=46,R=10,T=10,B=22;
  const pts=series.flatMap(s=>s.pts);if(pts.length<2)return `<div class="empty">${o.empty||'기록이 2개 이상 쌓이면 그래프가 표시됩니다'}</div>`;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(o.zero){y0=Math.min(y0,0);y1=Math.max(y1,0)}
  const pad=(y1-y0)*.08||Math.abs(y1)*.05||1;y0-=pad;y1+=pad;if(x1===x0)x1=x0+1;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';for(let i=0;i<=3;i++){const yv=y0+(y1-y0)*i/3,yy=Y(yv);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${esc(o.yFmt?o.yFmt(yv):fmtNum(yv,0))}</text>`}
  if(o.zero&&y0<0&&y1>0)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--tx3)" stroke-dasharray="3 3"/>`;
  const xl=[x0,(x0+x1)/2,x1];g+=xl.map((x,i)=>`<text x="${X(x)}" y="${H-6}" text-anchor="${i===0?'start':i===2?'end':'middle'}">${esc(o.xFmt?o.xFmt(x):x)}</text>`).join('');
  let p='';series.forEach((s,si)=>{if(!s.pts.length)return;const d=s.pts.map((q,i)=>(i?'L':'M')+X(q.x).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
    if(s.area)p+=`<path d="${d} L${X(s.pts[s.pts.length-1].x).toFixed(1)} ${H-B} L${X(s.pts[0].x).toFixed(1)} ${H-B}Z" fill="${s.color}" opacity=".12"/>`;
    p+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w??2}" ${s.dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(s.dots)p+=s.pts.map(q=>`<circle cx="${X(q.x).toFixed(1)}" cy="${Y(q.y).toFixed(1)}" r="${q.r||3.5}" fill="${q.c||s.color}" stroke="var(--card)" stroke-width="1.5"/>`).join('')});
  CH[id]={series,X,Y,W,H,L,R,T,B,x0,x1,o};
  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img">${g}${p}<line class="cur" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--tx3)" stroke-width="1" style="display:none"/></svg><div class="tip"></div></div>
    ${o.legend!==false?`<div class="lg">${series.filter(s=>s.name).map(s=>`<span><s style="background:${s.color}"></s>${esc(s.name)}</span>`).join('')}</div>`:''}`;
}
function chartMove(e){
  const el=e.target.closest('.chart');if(!el)return;const c=CH[el.dataset.chart];if(!c)return;
  const svg=$('svg',el),rc=svg.getBoundingClientRect();const vx=(e.clientX-rc.left)/rc.width*c.W;
  const base=c.series.find(s=>s.pts.length>1&&!s.noTip)||c.series[0];let best=null,bd=1e9;
  base.pts.forEach(p=>{const d=Math.abs(c.X(p.x)-vx);if(d<bd){bd=d;best=p}});if(!best)return;
  const ln=$('line.cur',svg);ln.setAttribute('x1',c.X(best.x));ln.setAttribute('x2',c.X(best.x));ln.style.display='';
  const tip=$('.tip',el);const rows=c.series.filter(s=>!s.noTip).map(s=>{const q=s.pts.find(p=>p.x===best.x);return q?`<div><span style="color:${s.color}">●</span> ${esc(s.name||'')} <b class="num">${esc(c.o.tipFmt?c.o.tipFmt(q.y,s):fmtNum(q.y))}</b>${q.lab?' '+esc(q.lab):''}</div>`:''}).join('');
  tip.innerHTML=`<div class="faint">${esc(c.o.xFmt?c.o.xFmt(best.x,true):best.x)}</div>${rows}`;tip.style.display='block';
  const px=c.X(best.x)/c.W*rc.width;tip.style.left=Math.min(Math.max(0,px-tip.offsetWidth/2),rc.width-tip.offsetWidth)+'px';tip.style.top='-6px';

/* ================= 주가 차트 (Cloudflare Worker → Yahoo Finance) ================= */
const PXR=[['1d','1일'],['5d','1주'],['1mo','1개월'],['3mo','3개월'],['1y','1년'],['5y','5년']];
const PX={},PXD={};
const pxIntra=r=>r==='1d'||r==='5d';
const pxTTL=(r,d)=>pxIntra(r)?(d&&!d.open?600e3:60e3):(d&&d.open?300e3:1800e3);
const chartUrlOk=u=>/^https:\/\/[a-z0-9-]+(\.[a-z0-9-]+)*\.workers\.dev$/i.test(str(u));
// 시트 티커(GOOGLEFINANCE 형식) → Yahoo 심볼. 국장은 6자리 코드 + .KS(코스닥은 Worker가 .KQ로 재시도)
function ySym(h){const t=str(h.ticker).toUpperCase();const i=t.indexOf(':');const ex=i>0?t.slice(0,i):'',code=i>0?t.slice(i+1):t;
  if(h.mkt==='KR')return /^[0-9A-Z]{6}$/.test(code)?code+(ex==='KOSDAQ'?'.KQ':'.KS'):'';
  return /^[A-Z0-9][A-Z0-9.\-]{0,11}$/.test(code)?code.replace(/\./g,'-'):''}
async function pxFetch(sym,r,base){
  if(S.cfg.demo&&!base)return Demo.chart(sym,r);
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),12000);
  try{const res=await fetch(`${base||S.cfg.chartUrl}/chart?s=${encodeURIComponent(sym)}&r=${r}`,{signal:ctl.signal,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'});
    const j=await res.json().catch(()=>null);if(!res.ok||!j||j.error)throw new Error((j&&j.error)||'HTTP '+res.status);
    if(!Array.isArray(j.t)||!j.t.length)throw new Error('시세 데이터가 비어 있습니다');return j}
  catch(e){throw new Error(e.name==='AbortError'?'응답 시간 초과':e.message==='Failed to fetch'?'차트 서버에 연결할 수 없습니다':e.message)}finally{clearTimeout(to)}}
function pxEnsure(h,force){

  const n=d.c.length,last=d.c[n-1],base=r==='1d'?(d.prev||d.o[0]):(pxIntra(r)?d.o[0]:(d.prev&&r!=='5y'?d.prev:d.o[0])),chg=last-base,rr=base?chg/base:0,cc=h.ccy;

   <div class="lg" style="margin-top:4px">${h.qty>0&&h.avg>0?'<span><s style="background:var(--warn)"></s>평단</span>':''}<span><s style="background:var(--ac)"></s>현재가</span>${pxIntra(r)?'':'<span style="color:var(--up)">▲ 매수</span><span style="color:var(--dn)">▼ 매도</span>'}</div>

function pxSvg(h,d,r){
  const n=d.c.length;if(n<2)return '<div class="empty">표시할 시세가 없습니다</div>';
  const W=340,H=214,L=4,R=52,T=8,B=20,VH=30,ph=H-T-B-VH-6,pw=W-L-R,line=pxIntra(r),usd=h.ccy==='USD';
  const fP=v=>usd?(v>=1000?v.toFixed(0):v.toFixed(2)):Math.round(v).toLocaleString('ko-KR');
  let lo=Infinity,hi=-Infinity;for(let i=0;i<n;i++){lo=Math.min(lo,line?d.c[i]:d.l[i]);hi=Math.max(hi,line?d.c[i]:d.h[i])}
  const prev=r==='1d'?d.prev:0;if(prev){lo=Math.min(lo,prev);hi=Math.max(hi,prev)}
  const span=(hi-lo)||hi*.01||1,avg=h.qty>0&&h.avg>0?h.avg:0,avgIn=avg&&avg>=lo-span*.35&&avg<=hi+span*.35;
  if(avgIn){lo=Math.min(lo,avg);hi=Math.max(hi,avg)}
  const pad=(hi-lo)*.06||1;lo-=pad;hi+=pad;
  const X=i=>L+(i+.5)*pw/n,Y=v=>T+(hi-v)/(hi-lo)*ph,bw=Math.max(1,Math.min(7,pw/n*.62)),vb=H-B,vmax=Math.max(1,...d.v);

  let g='';
  for(let k=0;k<=3;k++){const v=lo+(hi-lo)*(k+.5)/4,y=Y(v);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>`;if(pills.every(p=>Math.abs(p[0]-y)>15))g+=`<text x="${W-R+6}" y="${(y+3.5).toFixed(1)}">${fP(v)}</text>`}
  for(let i=0;i<n;i++){const vh=d.v[i]/vmax*VH;if(vh>.3)g+=`<rect x="${(X(i)-bw/2).toFixed(1)}" y="${(vb-vh).toFixed(1)}" width="${bw.toFixed(1)}" height="${vh.toFixed(1)}" fill="${up(i)?'var(--up)':'var(--dn)'}" opacity=".3"/>`}
  if(line){const col=last>=(prev||d.o[0])?'var(--up)':'var(--dn)';let p='';for(let i=0;i<n;i++)p+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(d.c[i]).toFixed(1);
    g+=`<path d="${p}L${X(n-1).toFixed(1)} ${T+ph}L${X(0).toFixed(1)} ${T+ph}Z" fill="${col}" opacity=".1"/><path d="${p}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/>`;
    if(prev)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(prev).toFixed(1)}" y2="${Y(prev).toFixed(1)}" stroke="var(--tx3)" stroke-dasharray="2 3"/>`}
  else for(let i=0;i<n;i++){const col=up(i)?'var(--up)':'var(--dn)',x=X(i).toFixed(1),y1=Y(Math.max(d.o[i],d.c[i])),y2=Y(Math.min(d.o[i],d.c[i]));
    g+=`<line x1="${x}" x2="${x}" y1="${Y(d.h[i]).toFixed(1)}" y2="${Y(d.l[i]).toFixed(1)}" stroke="${col}"/><rect x="${(X(i)-bw/2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y2-y1).toFixed(1)}" fill="${col}"/>`}
  if(avg&&avgIn)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(avg).toFixed(1)}" y2="${Y(avg).toFixed(1)}" stroke="var(--warn)" stroke-width="1.3"/>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(last).toFixed(1)}" y2="${Y(last).toFixed(1)}" stroke="var(--ac)" stroke-dasharray="4 3"/>`;
  // 매매 지점: 일·주봉에서 거래일이 속한 봉에 표시 (봉 날짜는 거래소 현지 날짜)
  const bs=d.t.map(t=>Math.floor((t+d.gmt)/86400)+25569),marks={};
  if(!line)h.trades.forEach(t=>{if(t.date<bs[0]||t.date>bs[n-1]+(r==='5y'?6:0))return;let i=n-1;while(i>0&&bs[i]>t.date)i--;const m=marks[i]||(marks[i]={b:[],s:[]});(t.type==='매수'?m.b:m.s).push(t)});
  Object.entries(marks).forEach(([i,m])=>{const x=X(+i);if(m.b.length)g+=`<path d="M${x.toFixed(1)} ${(Y(d.l[i])+4).toFixed(1)}l-4.5 7.5h9z" fill="var(--up)" stroke="var(--card)" stroke-width=".8"/>`;if(m.s.length)g+=`<path d="M${x.toFixed(1)} ${(Y(d.h[i])-4).toFixed(1)}l-4.5 -7.5h9z" fill="var(--dn)" stroke="var(--card)" stroke-width=".8"/>`});
  pills.forEach(([y,v,col,k,out])=>{y=Math.max(T+8,Math.min(T+ph-8,y));g+=`<rect x="${W-R+2}" y="${(y-8).toFixed(1)}" width="${R-2}" height="16" rx="4" fill="${col}"/><text class="pl ${k}" x="${W-R+6}" y="${(y+3.5).toFixed(1)}">${out?(avg>hi?'↑':'↓'):''}${fP(v)}</text>`});
  const lt=i=>new Date((d.t[i]+d.gmt)*1000),fx=(i,full)=>{const t=lt(i),md=`${p2(t.getUTCMonth()+1)}.${p2(t.getUTCDate())}`,hm=`${p2(t.getUTCHours())}:${p2(t.getUTCMinutes())}`;
    if(full)return r==='1d'?hm:r==='5d'?md+' '+hm:`${t.getUTCFullYear()}.${md}`;return r==='1d'?hm:(r==='1y'||r==='5y')?`${String(t.getUTCFullYear()).slice(2)}.${p2(t.getUTCMonth()+1)}`:md};
  [0,n>>1,n-1].forEach((i,k)=>g+=`<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="${['start','middle','end'][k]}">${fx(i)}</text>`);
  const id='px'+h.mkt+h.sheetId;PXD[id]={W,L,pw,n,d,fx,X,T,vb,marks,fP,usd,h};
  return `<div class="chart" data-px="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(h.name)} 주가 차트">${g}<line class="cur" x1="0" x2="0" y1="${T}" y2="${vb}" stroke="var(--tx3)" stroke-width="1" style="display:none"/></svg><div class="tip"></div></div>`;
}
function pxMove(e){

  const svg=$('svg',el),rc=svg.getBoundingClientRect(),vx=(e.clientX-rc.left)/rc.width*c.W;

  const ln=$('line.cur',svg);ln.setAttribute('x1',c.X(i));ln.setAttribute('x2',c.X(i));ln.style.display='';
  const m=c.marks[i],tr=m?[...m.b,...m.s].map(t=>`<div><span style="color:var(--${t.type==='매수'?'up':'dn'})">●</span> ${t.type} ${fmtQty(Math.abs(t.qty))}주 @ ${esc(fmtMoney(t.price,cc))}</div>`).join(''):'';

/* ---------- PIN ---------- */
function vPin(kind){
  const f=failState();const wait=f.until>Date.now()?Math.ceil((f.until-Date.now())/1000):0;
  const setting=kind==='set'||S.pinMode==='change';
  const title=kind==='set'?(S.pinFirst?'PIN 확인':'앱 잠금 PIN 설정'):S.pinMode==='change'?(S.pinFirst?'새 PIN 확인':'새 PIN 입력'):'주식일지 잠금 해제';
  const sub=S.pinMsg||(kind==='set'?'앱을 열 때 사용할 6자리 숫자':wait?`잠시 후 다시 시도하세요 (${wait}초)`:'PIN 6자리를 입력하세요');
  if(wait&&!setting)setTimeout(()=>{if(S.locked)render()},1000);
  const hasBio=!!LS.get('sj.bio')&&kind==='unlock'&&S.pinMode!=='change';
  return `<div class="lock"><div class="logo">${IC.logo}</div><h2>${title}</h2><p>${esc(sub)}</p>
   <div class="pdots" id="pdots">${[0,1,2,3,4,5].map(i=>`<i class="${i<S.pin.length?'f':''}"></i>`).join('')}</div>
   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pin" data-d="${n}">${n}</button>`).join('')}
   ${S.pinMode==='change'?`<button class="ghost" data-act="pinCancel">취소</button>`:hasBio?`<button class="ghost" data-act="bio" aria-label="지문">${IC.fp}</button>`:kind==='set'&&!S.pinFirst?`<button class="ghost" data-act="resetCfg">처음으로</button>`:'<span></span>'}
   <button data-act="pin" data-d="0">0</button><button class="ghost" data-act="pinDel" aria-label="지우기">${IC.del}</button></div>
   ${kind==='unlock'&&S.pinMode!=='change'?`<button class="btn sm" style="margin-top:22px;background:none;border:0;color:var(--tx3)" data-act="forgotPin">PIN을 잊었나요?</button>`:''}</div>`;
}
async function pinDigit(d){
  const f=failState();if(S.pinMode==='unlock'&&f.until>Date.now())return;
  if(S.pin.length>=6)return;S.pin+=d;const dots=$('#pdots');if(dots)[...dots.children].forEach((x,i)=>x.classList.toggle('f',i<S.pin.length));
  if(S.pin.length<6)return;
  const pin=S.pin;const setting=!LS.get('sj.pin')||S.pinMode==='change';
  if(setting){
    if(!S.pinFirst){S.pinFirst=pin;S.pin='';S.pinMsg='한 번 더 입력하세요';render();return}
    if(S.pinFirst!==pin){S.pinFirst='';S.pin='';S.pinMsg='PIN이 일치하지 않습니다. 다시 설정하세요';render();shake();return}
    await setPin(pin);S.pinFirst='';S.pin='';S.pinMsg='';const wasChange=S.pinMode==='change';S.pinMode='unlock';
    if(wasChange){S.locked=false;toast('PIN을 변경했습니다');S.v.tab='settings';render();if(!S.D)load();return}
    await unlocked();
    if(await bioAvail()&&!LS.get('sj.bio')){if(await confirmBox('지문 잠금 해제','이 기기의 지문/화면 잠금으로 앱을 열 수 있게 등록할까요?','등록')){try{await bioRegister();toast('지문 잠금 해제를 등록했습니다')}catch(e){toast('등록 취소: '+(e.message||e.name))}}}
    return;
  }
  const ok=await checkPin(pin);
  if(ok){S.pinMsg='';await unlocked()}
  else{regFail();S.pin='';const n=failState().n;S.pinMsg=n>=5?'여러 번 틀렸습니다. 잠시 후 다시 시도하세요':`PIN이 올바르지 않습니다 (${n}회)`;render();shake()}
}
function shake(){const d=$('#pdots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
document.addEventListener('keydown',e=>{if(!S.locked&&S.pinMode!=='change')return;if(!$('#pdots'))return;if(/^\d$/.test(e.key))pinDigit(e.key);else if(e.key==='Backspace'){S.pin=S.pin.slice(0,-1);render()}});

   <dl><dt>평가손익</dt><dd class="num ${cls(s.value-s.cost)}">${fmtPct(s.cost?(s.value-s.cost)/s.cost:0)}</dd><dt>예수금</dt><dd class="num">${fmtShort(s.cash,c)}</dd><dt>실현손익</dt><dd class="num ${cls(s.realized)}">${fmtShort(s.realized,c)}</dd></dl>

function vAlloc(){
  const D=S.D;const act=D.hold.filter(h=>h.active).sort((a,b)=>b.vK-a.vK);
  const cashK=D.sum.TOT.cash;const top=act.slice(0,7);const rest=act.slice(7);

  const tot=sum(segs,'v')||1;const kr=D.sum.KR.value,us=D.sum.USKRW.value;const all=kr+us+cashK||1;

   <div class="stack"><i style="width:${kr/all*100}%;background:var(--up)"></i><i style="width:${us/all*100}%;background:var(--dn)"></i><i style="width:${cashK/all*100}%;background:#7d8799"></i></div>
   <div class="row sb xs muted"><span><b class="up">●</b> 국장 ${fmtPct(kr/all,{sign:false})}</span><span><b class="dn">●</b> 미장 ${fmtPct(us/all,{sign:false})}</span><span><b style="color:#7d8799">●</b> 예수금 ${fmtPct(cashK/all,{sign:false})}</span></div></section>`;
}
function planAlerts(){
  const D=S.D,out=[];
  D.hold.filter(h=>h.active).forEach(h=>{const p=D.plans[h.key];if(!p)return;
    if(p.target&&h.price>=p.target)out.push({h,lvl:'good',t:`목표가 도달 (${fmtMoney(p.target,h.ccy)})`});
    else if(p.stop&&h.price<=p.stop)out.push({h,lvl:'warn',t:`손절가 이탈 (${fmtMoney(p.stop,h.ccy)})`});
    else if(p.target&&h.price>=p.target*.95)out.push({h,lvl:'info',t:`목표가까지 ${fmtPct(p.target/h.price-1,{sign:false})}`});
    else if(p.stop&&h.price<=p.stop*1.05)out.push({h,lvl:'warn',t:`손절가까지 ${fmtPct(1-p.stop/h.price,{sign:false})}`});});
  return out;
}
function vAlerts(){const a=planAlerts();if(!a.length)return '';
  return `<section class="card"><h2>목표가 · 손절가 알림</h2>${a.map(x=>`<button class="ins" style="width:100%;text-align:left" data-act="stock" data-key="${esc(x.h.key)}"><i class="${x.lvl}">${x.lvl==='good'?'✓':'!'}</i><div><b>${esc(x.h.name)}</b> <span class="num">${fmtMoney(x.h.price,x.h.ccy)}</span><div class="muted xs">${esc(x.t)}</div></div></button>`).join('')}</section>`}
function vInsights(){
  const D=S.D,s=D.sum,act=D.hold.filter(h=>h.active).sort((a,b)=>b.vK-a.vK),tv=D.totHoldK||1,L=[];
  const cr=s.TOT.total?s.TOT.cash/s.TOT.total:0;
  L.push({lvl:cr<.05?'warn':'info',t:`예수금 비중 ${fmtPct(cr,{sign:false})} (${fmtMoney(s.TOT.cash,'KRW')}). ${cr<.05?'추가 매수·비상 대응 여력이 작은 편입니다.':''}`});
  if(act.length){const t1=act[0].vK/tv,t3=sum(act.slice(0,3),'vK')/tv;L.push({lvl:t1>.3||t3>.6?'warn':'info',t:`집중도: 1위 ${esc(act[0].name)} ${fmtPct(t1,{sign:false})}, 상위 3종목 ${fmtPct(t3,{sign:false})} (보유 평가액 기준)`})}
  const lev=act.filter(h=>h.lev);if(lev.length){const lw=sum(lev,'vK')/tv;L.push({lvl:lw>.2?'warn':'info',t:`레버리지/인버스 상품(이름·티커 기준 추정) ${lev.length}종목, 비중 ${fmtPct(lw,{sign:false})}: ${lev.map(h=>esc(h.tab)).join(', ')}`})}
  const deep=act.filter(h=>h.rr<=-.3);if(deep.length)L.push({lvl:'warn',t:`평가손실 -30% 이하: ${deep.map(h=>`${esc(h.tab)} ${fmtPct(h.rr)}`).join(', ')}`});
  const krR=s.KR.total+s.USKRW.total?s.KR.total/(s.KR.total+s.USKRW.total):0;L.push({lvl:'info',t:`국장 ${fmtPct(krR,{sign:false})} · 미장 ${fmtPct(1-krR,{sign:false})} (계좌 총평가 원화 기준)`});
  const fxE=fxEffect();if(fxE&&D.cash.baseFx)L.push({lvl:'info',t:`환율 영향: 기준 환율(누적 달러 매수 평균) ${fmtNum(D.cash.baseFx)}원 대비 현재 ${fmtNum(D.fx)}원 → 미장 원금 기준 약 ${fmtMoney(fxE,'KRW',{sign:true})}의 환차손익이 원화 총손익에 포함됨`});
  const noPlan=act.filter(h=>!D.plans[h.key]);if(D.has.plan&&noPlan.length)L.push({lvl:'info',t:`목표가·손절가 미설정 ${noPlan.length}종목: ${noPlan.slice(0,5).map(h=>esc(h.tab)).join(', ')}${noPlan.length>5?' 외':''}`});
  const mis=D.hold.filter(h=>h.mismatch||h.unsorted);if(mis.length)L.push({lvl:'warn',t:`데이터 확인 필요: ${mis.map(h=>esc(h.tab)+(h.unsorted?'(날짜 순서)':'(계산 불일치)')).join(', ')}`});
  if(D.cash.missing&&!/없음/.test(D.cash.missing))L.push({lvl:'warn',t:`현금투자에 없는 거래 계좌: ${esc(D.cash.missing)}`});
  return `<section class="card"><h2>포트폴리오 점검</h2>${L.map(x=>`<div class="ins"><i class="${x.lvl}">${x.lvl==='warn'?'!':'i'}</i><div>${x.t}</div></div>`).join('')}<div class="xs faint" style="margin-top:8px">사실 기반 요약이며 매수·매도 권유가 아닙니다.</div></section>`;
}
const fxEffect=()=>{const D=S.D;return D.cash.fxEffect!=null?D.cash.fxEffect:(D.cash.baseFx&&D.fx?D.sum.US.principal*(D.fx-D.cash.baseFx):0)};

function tradeStats(m){
  const sells=[];S.D.mk[m].holdings.forEach(h=>h.trades.forEach(t=>{if(t.type==='매도')sells.push({h,t})}));
  const w=sells.filter(x=>x.t.realized>0),l=sells.filter(x=>x.t.realized<0);
  const sw=sum(w,x=>x.t.realized),sl=sum(l,x=>x.t.realized);
  const buys=S.D.mk[m].holdings.reduce((a,h)=>a+h.trades.filter(t=>t.type==='매수').length,0);
  const best=sells.slice().sort((a,b)=>b.t.realized-a.t.realized);
  return {n:sells.length,buys,win:sells.length?w.length/sells.length:0,avgW:w.length?sw/w.length:0,avgL:l.length?sl/l.length:0,pf:sl?sw/Math.abs(sl):0,best:best[0],worst:best[best.length-1],sw,sl};
}

   <div class="metrics" style="margin-top:14px"><div><span>평균 이익 (이익 거래)</span><b class="num up">${fmtMoney(s.avgW,c,{sign:true})}</b></div><div><span>평균 손실 (손실 거래)</span><b class="num dn">${fmtMoney(s.avgL,c,{sign:true})}</b></div>

function tagStats(m){

function tRb(){
  const D=S.D,sc=S.v.rbs,inc=S.v.rbc==='1';const hs=D.hold.filter(h=>h.active&&(sc==='ALL'||h.mkt===sc));const c=sc==='US'?'USD':'KRW';
  const val=h=>sc==='ALL'?h.vK:h.value;const cash=sc==='ALL'?D.sum.TOT.cash:D.sum[sc].cash;
  const base=sum(hs,val)+(inc?cash:0);
  const rows=hs.map(h=>{const p=D.plans[h.key];const tw=S.rbw&&S.rbw[h.key]!=null?S.rbw[h.key]:(p&&p.wt)||0;return {h,v:val(h),cw:base?val(h)/base:0,tw}});
  const tws=sum(rows,'tw');
  const body=rows.map(r=>{const tv=base*r.tw/100,d=tv-r.v;const px=sc==='ALL'&&r.h.ccy==='USD'?r.h.price*D.fx:r.h.price;const q=px?Math.trunc(d/px):0;
    return `<tr><td>${esc(r.h.tab)}</td><td class="num">${fmtPct(r.cw,{sign:false})}</td><td><input data-rbw="${esc(r.h.key)}" inputmode="decimal" value="${r.tw||''}" placeholder="0"></td><td class="num ${cls(d)}">${r.tw||tws?fmtShort(d,c):'-'}</td><td class="num ${cls(q)}">${r.tw||tws?(q>0?'+':'')+q:'-'}</td></tr>`}).join('');
  return `<div class="row sb" style="margin-top:12px">${seg('rbs',[['KR','국장'],['US','미장'],['ALL','전체']])}${seg('rbc',[['1','예수금 포함'],['0','제외']])}</div>
   <section class="card"><h2>목표 비중 리밸런싱 <span class="xs faint">${c}</span></h2>
   <div class="scrollx"><table class="tbl"><thead><tr><th>종목</th><th>현재</th><th>목표%</th><th>차이</th><th>수량</th></tr></thead><tbody>${body}</tbody>
   <tfoot><tr><td>합계</td><td></td><td class="num ${Math.abs(tws-100)>0.01&&tws?'dn':''}">${fmtNum(tws,1)}%</td><td colspan="2" class="xs muted">기준 ${fmtShort(base,c)}</td></tr></tfoot></table></div>
   ${inc?`<div class="xs faint" style="margin-top:8px">목표% 합이 100% 미만이면 나머지는 예수금으로 남습니다. 수량은 현재가 기준(소수점 버림)${sc==='ALL'?', 미장은 현재환율 환산':''}.</div>`:''}
   <div class="btns" style="margin-top:12px"><button class="btn sm" data-act="rbReset">계획값으로</button>${D.has.plan?`<button class="btn sm pri" data-act="rbSave" data-busy>목표비중 저장</button>`:''}</div></section>`;
}
function calcRun(box){
  const k=box.dataset.calc,v=fv(box),c=v.ccy||'KRW',n=k=>num(v[k]);const out=$('#calcOut',box);if(!out)return;
  const R=(l,x,cl='')=>`<div class="row"><span class="muted">${l}</span><b class="num ${cl}">${x}</b></div>`;
  if(k==='avg'){const q0=n('q0'),a0=n('a0'),add=n('n'),p=n('p'),cur=n('cur'),tg=n('tgt');let h='';
    if(add>0){const na=(q0*a0+add*p)/(q0+add);h+=R('추가 매수금액',fmtMoney(add*p,c))+R('새 평균단가',fmtMoney(na,c))+R('평단 변화',fmtPct(a0?na/a0-1:0,{d:2}),cls(na-a0))+R('새 보유수량',fmtQty(q0+add)+'주')+R('현재가 기준 수익률',fmtPct(na?cur/na-1:0,{d:2}),cls(cur-na))}
    if(tg>0){if((tg<a0&&p<tg)||(tg>a0&&p>tg)){const need=q0*(a0-tg)/(tg-p);h+=`<div style="height:8px"></div>`+R(`평단 ${fmtMoney(tg,c)} 필요 수량`,fmtQty(Math.ceil(need*100)/100)+'주')+R('필요 금액',fmtMoney(need*p,c))}else h+=`<div class="err">목표 평단은 현재 평단과 매수 단가 사이여야 합니다</div>`}
    out.innerHTML=h||'<span class="muted">추가 매수 수량 또는 목표 평단을 입력하세요</span>'}
  else if(k==='sell'){const q0=n('q0'),a0=n('a0'),q=n('n'),p=n('p'),fr=calcFee(v.mkt,str(v.acc),'매도',toSerial(todayStr()),q,p),fee=fr.fee;
    if(q>q0+1e-9){out.innerHTML='<div class="err">보유수량보다 많습니다</div>';return}
    const proceeds=q*p-fee,real=proceeds-q*a0;
    out.innerHTML=R('매도금액',fmtMoney(q*p,c))+R('수수료+세금',fmtMoney(fee,c))+`<div class="xs faint" style="text-align:right">${esc(fr.desc)}</div>`+R('정산금액',fmtMoney(proceeds,c))+R('실현손익',fmtMoney(real,c,{sign:true}),cls(real))+R('수익률',fmtPct(q*a0?real/(q*a0):0,{d:2}),cls(real))+R('남은 수량',fmtQty(q0-q)+'주')+R('남은 평가금액(매도가 기준)',fmtMoney((q0-q)*p,c))}
  else if(k==='size'){const cap=n('cap'),r=n('risk'),e=n('e'),st=n('st'),tg=n('tg');
    if(!(e>0&&st>0)){out.innerHTML='<span class="muted">진입가와 손절가를 입력하세요</span>';return}
    if(st>=e){out.innerHTML='<div class="err">손절가는 진입가보다 낮아야 합니다</div>';return}
    const loss=cap*r/100,per=e-st,q=Math.floor(loss/per),amt=q*e;
    out.innerHTML=R('허용 손실액',fmtMoney(loss,c))+R('주당 위험',fmtMoney(per,c)+` (${fmtPct(per/e,{sign:false,d:2})})`)+R('매수 가능 수량',fmtQty(q)+'주')+R('매수 금액',fmtMoney(amt,c))+R('자산 대비 비중',fmtPct(cap?amt/cap:0,{sign:false}))+(tg>e?R('손익비',((tg-e)/per).toFixed(2))+R('목표 도달 시 이익',fmtMoney(q*(tg-e),c,{sign:true}),'up'):'')}
}

    if(s.computed&&s.flows){for(let r=Math.max(a.r1,35);r<=Math.min(a.r2,35+s.flows.length-1);r++){const row=s.flows[r-35];for(let c=a.c1;c<=Math.min(a.c2,row.length-1);c++)row[c]=''}while(s.flows.length&&!s.flows[s.flows.length-1].some(x=>x!==''&&x!=null))s.flows.pop();return}for(let r=a.r1;r<=Math.min(a.r2,s.cells.length-1);r++){const row=s.cells[r]||[];for(let c=a.c1;c<=Math.min(a.c2,row.length-1);c++)row[c]=''}}
  async function handle(method,url,body){
    init();await sleep(90);
    if(url.includes('userinfo'))return {email:'demo@example.com'};
    const u=new URL(url);const raw=u.pathname.slice('/v4/spreadsheets/'.length);const parts=raw.split('/');const [idp,op]=parts[0].split(':');const b=bookOf(idp);if(!b)throw new Error('demo: unknown id');
    if(parts.length===1&&!op&&method==='GET')return {sheets:wb[b].sheets.map(s=>({properties:{sheetId:s.id,title:s.title}}))};
    if(parts.length===1&&op==='batchUpdate'){const rep=[];for(const rq of body.requests){
      if(rq.duplicateSheet){const d=rq.duplicateSheet;const src=wb[b].sheets.find(s=>s.id===d.sourceSheetId);const ns={id:nextSid++,title:d.newSheetName,cells:JSON.parse(JSON.stringify(src.cells))};wb[b].sheets.splice(d.insertSheetIndex??wb[b].sheets.length,0,ns);
        rep.push({duplicateSheet:{properties:{sheetId:ns.id,title:ns.title}}})}
      else if(rq.addSheet){const t=rq.addSheet.properties.title;if(sheet(b,t))throw new Error('이미 존재하는 시트: '+t);const ns={id:nextSid++,title:t,cells:[]};wb[b].sheets.push(ns);rep.push({addSheet:{properties:{sheetId:ns.id,title:t}}})}
      else if(rq.deleteDimension){const r=rq.deleteDimension.range;const s=wb[b].sheets.find(x=>x.id===r.sheetId);s.cells.splice(r.startIndex,r.endIndex-r.startIndex);rep.push({})}}return {replies:rep}}
    const vop=parts[1]||'';
    if(vop==='values:batchGet'){const rs=u.searchParams.getAll('ranges');const mode=u.searchParams.get('valueRenderOption');return {valueRanges:rs.map(r=>{const a=parseA1(r);const s=sheet(b,a.title);if(!s)throw new Error('Unable to parse range: '+r);return {range:r,values:slice(view(b,s,mode),a)}})}}
    if(vop==='values:batchUpdate'){body.data.forEach(d=>write(b,d.range,d.values));return {}}
    if(vop==='values:batchClear'){body.ranges.forEach(r=>clear(b,r));return {}}
    if(vop==='values'&&parts[2]){const r=decodeURIComponent(parts.slice(2).join('/'));const a=parseA1(r);const s=sheet(b,a.title);if(!s)throw new Error('Unable to parse range: '+r);
      if(method==='GET')return {range:r,values:slice(view(b,s,u.searchParams.get('valueRenderOption')),a)};if(method==='PUT'){write(b,r,body.values);return {}}}
    throw new Error('demo: unsupported '+method+' '+url);
  }
  // 가상 시세: 티커별로 고정된 무작위 흐름, 마지막 값은 데모 현재가
  function chart(sym,r){
    const code=sym.replace(/\.(KS|KQ)$/,'').replace(/-/g,'.');const tk=Object.keys(PR).find(k=>k.split(':')[1]===code);if(!tk)return Promise.reject(new Error('시세를 찾을 수 없습니다: '+sym));
    const kr=/\.(KS|KQ)$/.test(sym),gmt=kr?32400:-14400,price=PR[tk],dec=kr?0:2;
    let seed=[...sym].reduce((a,ch)=>a*31+ch.charCodeAt(0)|0,7)||7;const rnd=()=>{seed=(seed*16807)%2147483647;if(seed<=0)seed+=2147483646;return seed/2147483647};
    const rd=v=>kr?Math.round(v/(v>=50000?100:v>=5000?10:1))*(v>=50000?100:v>=5000?10:1):Math.round(v*100)/100;
    const days=[];const dt=new Date(Date.now()+gmt*1000);dt.setUTCHours(0,0,0,0);if(dt.getUTCDay()%6===0)dt.setUTCDate(dt.getUTCDate()-(dt.getUTCDay()===0?2:1));
    while(days.length<1300){if(dt.getUTCDay()%6)days.unshift(dt.getTime()/1000-gmt+(kr?9*3600:9.5*3600));dt.setUTCDate(dt.getUTCDate()-1)}
    const vol=kr?.019:.017;const C=new Array(days.length);C[C.length-1]=price;for(let i=C.length-1;i>0;i--)C[i-1]=C[i]/(1+(rnd()-.485)*vol*2);
    const bars=days.map((t,i)=>{const c=C[i],o=i?C[i-1]*(1+(rnd()-.5)*vol*.4):c;return {t,o,h:Math.max(o,c)*(1+rnd()*vol*.5),l:Math.min(o,c)*(1-rnd()*vol*.5),c,v:Math.round((kr?4e5:3e6)*(.4+rnd()))}});
    const intra=(nd,step)=>{const out=[];for(let k=nd;k>=1;k--){const day=bars[bars.length-k],pc=bars[bars.length-k-1].c;const m=Math.round(390/step);let p=pc;
      for(let j=0;j<m;j++){const target=pc+(day.c-pc)*(j+1)/m;const o=p;p=j===m-1?day.c:target*(1+(rnd()-.5)*vol*.25);out.push({t:day.t+j*step*60,o,h:Math.max(o,p)*(1+rnd()*.002),l:Math.min(o,p)*(1-rnd()*.002),c:p,v:Math.round(day.v/m*(.5+rnd()))})}}return out};
    const wk=b=>{const out=[];let cur=null,key=-1;b.forEach(x=>{const k=Math.floor((x.t+gmt+3*86400)/(7*86400));if(k!==key){key=k;cur={...x};out.push(cur)}else{cur.h=Math.max(cur.h,x.h);cur.l=Math.min(cur.l,x.l);cur.c=x.c;cur.v+=x.v}});return out};
    const sel={'1d':()=>intra(1,5),'5d':()=>intra(5,30),'1mo':()=>bars.slice(-22),'3mo':()=>bars.slice(-64),'1y':()=>bars.slice(-250),'5y':()=>wk(bars)}[r]();
    const prev=r==='1d'?bars[bars.length-2].c:r==='5y'?null:bars[bars.length-1-(r==='5d'?5:r==='1mo'?22:r==='3mo'?64:250)].c;
    const out={s:sym,ccy:kr?'KRW':'USD',gmt,prev:prev&&rd(prev),open:false,at:0,t:[],o:[],h:[],l:[],c:[],v:[]};
    sel.forEach(b=>{out.t.push(b.t);['o','h','l','c'].forEach(f=>out[f].push(rd(b[f])));out.v.push(b.v)});
    return sleep(220).then(()=>out);
  }
  return {handle,reset,IDS,chart};
})();

  if(configured()&&!S.cfg.demo)loadGIS().catch(()=>{});

  render();

boot();
